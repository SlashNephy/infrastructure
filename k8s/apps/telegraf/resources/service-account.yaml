apiVersion: v1
kind: ServiceAccount
metadata:
  name: telegraf

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: telegraf-cluster-role

rules:
  - apiGroups:
      - metrics.k8s.io
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - nodes
      # kubelet の /pods 用。nodes/proxy は kubelet の任意の API (exec を含む) を許すため、細粒度の nodes/pods に絞る
      - nodes/pods
      - nodes/stats
      - persistentvolumes
      - pods
      - services
      - endpoints
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: telegraf-cluster-role-binding

roleRef:
  name: telegraf-cluster-role
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
subjects:
  - name: telegraf
    kind: ServiceAccount
