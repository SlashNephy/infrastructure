
additionalArguments:
  - --api.disabledashboardad=true

additionalVolumeMounts:
  - name: plugins
    mountPath: /plugins-storage

autoscaling:
  enabled: false

deployment:
  additionalVolumes:
    - name: plugins
      persistentVolumeClaim:
        claimName: plugins-storage
  minReadySeconds: 30
  replicas: 2
  terminationGracePeriodSeconds: 7200

env:
  - name: TZ
    value: Asia/Tokyo

experimental:
  plugins:
    cloudflarewarp:
      moduleName: github.com/BetterCorp/cloudflarewarp
      # renovate: datasource=github-tags depName=BetterCorp/cloudflarewarp
      version: v1.3.3

extraObjects:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: plugins-storage
    spec:
      accessModes:
        - ReadWriteMany
      resources:
        requests:
          storage: 1Gi
      selector:
        matchLabels:
          name: plugins-storage
      storageClassName: local
  - apiVersion: v1
    kind: PersistentVolume
    metadata:
      name: plugins-storage
      labels:
        name: plugins-storage
    spec:
      accessModes:
        - ReadWriteMany
      capacity:
        storage: 1Gi
      local:
        path: /mnt/local/traefik/plugins-storage
      nodeAffinity:
        required:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - lily
      persistentVolumeReclaimPolicy: Retain
      storageClassName: local

global:
  checkNewVersion: false

ingressRoute:
  dashboard:
    enabled: false

# https://docs.traefik.io/observability/logs/
logs:
  access:
    enabled: true
    # https://docs.traefik.io/observability/access-logs/#limiting-the-fieldsincluding-headers
    fields:
      general:
        defaultmode: keep
        names:
          ClientAddr: drop # ClientHost:ClientPort の組み合わせなので不要
          StartLocal: drop # time で十分
          StartUTC: drop
      headers:
        # 全ヘッダーを記録すると 1 レコード 3,554 bytes に達し、その 73.5% を
        # ヘッダーが占めていた。drop を既定にすることで、新しい機密ヘッダーが
        # 増えても明示的に keep しない限りログに載らない。
        defaultmode: drop
        names:
          Accept-Language: keep
          # Cloudflare のジオ情報。緯度経度 (Cf-Iplatitude/Cf-Iplongitude)、
          # 郵便番号、タイムゾーンは所在地の特定精度が高すぎるため keep しない。
          Cf-Connecting-Ip: keep
          Cf-Ipcity: keep
          Cf-Ipcountry: keep
          Cf-Ray: keep
          Cf-Visitor: keep
          Origin: keep
          Referer: keep
          Sec-Ch-Ua: keep
          Sec-Ch-Ua-Mobile: keep
          Sec-Ch-Ua-Platform: keep
          Sec-Fetch-Dest: keep
          Sec-Fetch-Mode: keep
          Sec-Fetch-Site: keep
          User-Agent: keep
          X-Real-Ip: keep
    format: json
  general:
    level: INFO

ocsp:
  enabled: true

ports:
  web:
    expose:
      default: true
    nodePort: 80

  websecure:
    asDefault: true
    expose:
      default: true
    http:
      # https://doc.traefik.io/traefik/middlewares/overview/
      # https://doc.traefik.io/traefik/routing/entrypoints/#middlewares
      middlewares:
        - traefik-security-headers@kubernetescrd
        # - traefik-custom-error-pages@kubernetescrd
        - traefik-ban-robots@kubernetescrd
        - traefik-trust-cloudflare-ips@kubernetescrd
      # https://doc.traefik.io/traefik/routing/entrypoints/#tls
      tls:
        domains:
          - main: starry.blue
            sans:
              - "*.starry.blue"
              - "*.gateway.starry.blue"
        enabled: true
        options: traefik-cloudflare@kubernetescrd

    http3:
      advertisedPort: 443
      enabled: true

    nodePort: 443

priorityClassName: load-balancer

providers:
  kubernetesCRD:
    allowCrossNamespace: true
    allowEmptyServices: true
    allowExternalNameServices: true
    enabled: true
  kubernetesGateway:
    enabled: true

  kubernetesIngress:
    allowExternalNameServices: true
    enabled: true
service:
  ipFamilyPolicy: PreferDualStack
  type: NodePort
