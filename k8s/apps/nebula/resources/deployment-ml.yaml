apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml

spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml
  template:
    metadata:
      labels:
        app: ml
    spec:
      containers:
        - name: ml
          image: ghcr.io/slashnephy/nebula-ml:main@sha256:7d4a9dab6f5b78a0aa4fdf040e6256c7aa3e590a78f1fe9e9aa87f0f3ea9c4a8
          env:
            - name: DEVICE
              value: openvino
            - name: MODEL_CACHE_DIR
              value: /cache
            - name: MAX_MEMORY_MB
              value: "8192"
          envFrom:
            - secretRef:
                name: ml-secrets
          ports:
            - name: http
              containerPort: 8083
          volumeMounts:
            - name: model-cache
              mountPath: /cache
            - name: tmp
              mountPath: /tmp
          # requests は低く、limits で上限を切る。requests を書かずに limits だけ置くと
          # requests が limits と同値になり Guaranteed に昇格して etcd との競合で優位に
          # 立ってしまうため、意図的に Burstable に留める。
          # memory limits は MAX_MEMORY_MB=8192 に対する余裕を見て 10Gi
          resources:
            limits:
              cpu: "3"
              gpu.intel.com/i915: "1"
              memory: 10Gi
            requests:
              cpu: 500m
              memory: 2Gi
          livenessProbe:
            failureThreshold: 5
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      volumes:
        - name: model-cache
          hostPath:
            path: /mnt/local/nebula/ml-model-cache
            type: DirectoryOrCreate
        - name: tmp
          emptyDir: {}
      restartPolicy: Always
      imagePullSecrets:
        - name: ghcr-io-credentials
      securityContext:
        seccompProfile:
          type: RuntimeDefault
