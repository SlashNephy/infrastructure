# kotatsu-db を pg_dump で毎時 dump し、/mnt/local/kotatsu/db-backup に新しい順に KEEP_COUNT 個を残す。
# 稼働中のデータディレクトリ (/mnt/local/kotatsu/db) は、生のファイルでは整合が取れないので、Lily のホストのバックアップ
# (maintenance-backup-local、毎日 04:30) から外してある。代わりに、この dump がホストのバックアップに入り、pool とオフサイトに送られる。
# 書きかけのファイルがホストのバックアップに入らないよう、.part に書いてから改名する。
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-database

spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          automountServiceAccountToken: false
          containers:
            - command:
                - bash
                - -c
                - |
                  set -euo pipefail
                  name="kotatsu-$(date '+%Y%m%d-%H%M').dump"
                  trap 'rm -f "$name.part"' EXIT
                  pg_dump --format=custom --no-password --file="$name.part"
                  mv "$name.part" "$name"
                  ls -l "$name"
                  ls -1r kotatsu-*.dump | tail -n +$((KEEP_COUNT + 1)) | xargs -r rm -v
              env:
                - name: KEEP_COUNT
                  value: "24"
                - name: PGDATABASE
                  value: kotatsu
                - name: PGHOST
                  value: kotatsu-db-rw
                # CloudNativePG が作るアプリ用のユーザー (データベースの所有者)
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      key: password
                      name: kotatsu-db-app
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      key: username
                      name: kotatsu-db-app
                - name: TZ
                  value: Asia/Tokyo
              # pg_dump はサーバーと同じメジャーの版を使う (database.yaml の imageName)
              image: public.ecr.aws/docker/library/postgres:18.7-bookworm@sha256:194e55feb2597b1465dbee81cc9fd8d204566cd2eb42c8d22fd6c931a38781b1
              name: app
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
                runAsGroup: 1000
                runAsUser: 1000
              volumeMounts:
                - mountPath: /backup
                  name: backup
              workingDir: /backup
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumes:
            # 持ち主は uid 1000
            - hostPath:
                path: /mnt/local/kotatsu/db-backup
                type: Directory
              name: backup
  schedule: "20 * * * *"
  successfulJobsHistoryLimit: 1
  timeZone: Asia/Tokyo
