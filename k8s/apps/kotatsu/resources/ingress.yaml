apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: route-gateway

spec:
  routes:
    # bot のクロールを抑止するため robots.txt を返す。
    - kind: Rule
      match: Host(`kotatsu.gateway.starry.blue`) && Path(`/robots.txt`)
      priority: 100
      services:
        - name: robots-txt
          namespace: traefik
          port: http

    - kind: Rule
      match: Host(`kotatsu.gateway.starry.blue`)
      priority: 10
      services:
        - name: kotatsu
          port: http
      middlewares:
        - name: forward-auth-authentik
          namespace: authentik

    - kind: Rule
      match: Host(`kotatsu.gateway.starry.blue`) && PathPrefix(`/outpost.goauthentik.io/`)
      priority: 15
      services:
        - name: authentik-server
          namespace: authentik
          port: http

    - kind: Rule
      match: Host(`kotatsu.gateway.starry.blue`) && (PathPrefix(`/api`) || Path(`/mcp`) || PathPrefix(`/oauth`) || PathPrefix(`/.well-known`) || Path(`/healthz`))
      priority: 20
      services:
        - name: kotatsu
          port: http

  tls:
    options:
      name: gateway
      namespace: traefik

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: route-cloudflare

spec:
  routes:
    # bot のクロールを抑止するため robots.txt を返す。
    - kind: Rule
      match: Host(`kotatsu.starry.blue`) && Path(`/robots.txt`)
      priority: 100
      services:
        - name: robots-txt
          namespace: traefik
          port: http

    - kind: Rule
      match: Host(`kotatsu.starry.blue`)
      priority: 10
      services:
        - name: kotatsu
          port: http
      middlewares:
        - name: redirect-to-gateway

    - kind: Rule
      match: Host(`kotatsu.starry.blue`) && (PathPrefix(`/api`) || Path(`/mcp`) || PathPrefix(`/oauth`) || PathPrefix(`/.well-known`) || Path(`/healthz`))
      priority: 20
      services:
        - name: kotatsu
          port: http

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-to-gateway

spec:
  redirectRegex:
    regex: ^https://kotatsu.starry.blue/(.*)
    replacement: https://kotatsu.gateway.starry.blue/${1}
