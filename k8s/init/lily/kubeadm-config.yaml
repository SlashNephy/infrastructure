# https://kubernetes.io/docs/reference/config-api/kubeadm-config.v1beta4/
#
# このファイルはクラスタ設定の唯一の情報源であり、init だけでなくアップグレード時にも渡す。
#   kubeadm upgrade apply --config k8s/init/lily/kubeadm-config.yaml v1.x.y
# こうすると kube-system/kubeadm-config と kube-system/kubelet-config の
# ConfigMap が本ファイルで上書きされ、apiserver の static pod manifest と
# /var/lib/kubelet/config.yaml がそこから再生成される。
# ConfigMap に書いていない設定 (failSwapOn, service-node-port-range 等) は
# アップグレードのたびに消えるため、手で足さず必ずここに書くこと。

apiVersion: kubeadm.k8s.io/v1beta4
kind: ClusterConfiguration
apiServer:
  extraArgs:
    - name: authorization-mode
      value: Node,RBAC
    # 53 番 (DNS) を NodePort で公開するため下限を広げている
    - name: service-node-port-range
      value: 53-60000
controllerManager:
  extraArgs:
    # Pod の IP は Cilium の cluster-pool IPAM が CiliumNode に割り当てるため、ノードの podCIDR は使わない。
    # podSubnet を書くと kubeadm が allocate-node-cidrs=true を付け、kube-controller-manager が
    # 割り当てを試みる。IPv6 の podSubnet (/64) は serviceSubnet (/112) を含むため割り当てられる
    # /64 が 1 つも残らず、CIDRNotAvailable を出して約 5 分ごとに失敗し続けていた
    - name: allocate-node-cidrs
      value: "false"
networking:
  # Cilium の cluster-pool IPAM のプール (k8s/system/cilium/lily) と同じ範囲にする
  podSubnet: 10.0.0.0/16,fd00::/104
  serviceSubnet: 10.1.0.0/16,fdac:2d12:9f5::/112

---
apiVersion: kubeadm.k8s.io/v1beta4
kind: InitConfiguration
nodeRegistration:
  name: lily
  criSocket: unix:///var/run/crio/crio.sock
# Cilium が kubeProxyReplacement: true でサービスの負荷分散を BPF で担うため、
# kube-proxy addon は入れない。
skipPhases:
  - addon/kube-proxy

---
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
# privileged を外した Pod が、自身のネットワーク名前空間に閉じた sysctl を Pod の
# securityContext.sysctls で設定できるようにする。いずれも既定の許可リストに無い。
# ip_forward / forwarding は Pod 内での転送に、disable_ipv6 は VPN を張る Pod で
# トンネル外への IPv6 の素抜けを防ぐのに使う。ワイルドカードは使わず個別に許可する
allowedUnsafeSysctls:
  - net.ipv4.ip_forward
  - net.ipv6.conf.all.forwarding
  - net.ipv6.conf.all.disable_ipv6
  - net.ipv6.conf.default.disable_ipv6
# 既定の 100Mi では、kubelet が退避を始める前にカーネルの回収が詰まる。
# evictionHard は 1 つでも書くと、書かなかった項目が既定値ではなく 0 になるので、既定値も書き写す
evictionHard:
  imagefs.available: 15%
  imagefs.inodesFree: 5%
  memory.available: 1Gi
  nodefs.available: 10%
  nodefs.inodesFree: 5%
# lily は swap を有効にしているため、無いと kubelet が起動しない
failSwapOn: false
# イメージを 7 日で GC する。閾値ベースの GC は既定値 (high 85 / low 80) のまま。
# 片方だけ下げると low > high になって kubelet が起動不能になる
imageMaximumGCAge: 168h
# Pod 全体 (kubepods.slice) の memory.max を、ホストの常駐分を除いた値に下げる。
# 無いと Pod がノードのメモリを使い切り、ページキャッシュが空になって
# crio や kubelet まで I/O 待ちで詰まる (crio が watchdog で落ちた)。
# 値は kubepods.slice の外の常駐 (system.slice の anon 約 1.6GiB) から決めた。
# 上げるほど allocatable が減り、requests の大きい Pod が載らなくなる
systemReserved:
  memory: 1Gi

---
# kubeadm upgrade apply / upgrade node はどちらも addon フェーズを持ち、
# その中に kube-proxy サブフェーズがある。skip しないとアップグレードのたびに
# kube-proxy DaemonSet が復活する。
#   kubeadm upgrade apply --config k8s/init/lily/kubeadm-config.yaml v1.x.y
apiVersion: kubeadm.k8s.io/v1beta4
kind: UpgradeConfiguration
apply:
  skipPhases:
    - addon/kube-proxy
node:
  skipPhases:
    - addon/kube-proxy
