# Kotatsu の PostgreSQL。HA は目指さない (lily は単一ノードで PV も local のため)。
# 接続先は、CloudNativePG が作る Secret kotatsu-db-app の uri を使う。
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: kotatsu-db

spec:
  bootstrap:
    initdb:
      database: kotatsu
      encoding: UTF8
      owner: kotatsu
  # 拡張を使わず、照合順序も C なので、拡張やロケールを含まない minimal にする。
  # タグは PostgreSQL の版、ビルドの日時、種類、OS の順で、Renovate が版とビルドの両方を追う (renovate.json5)。
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-202611160820-minimal-trixie@sha256:452a15584e2aa1ce658c4ae8538b5dc157eb031d41b82fd19882e0c03bcec01d
  instances: 1
  postgresql:
    parameters:
      log_timezone: Asia/Tokyo
      timezone: Asia/Tokyo
  # 7 日の実測で、メモリはピークでも 787MiB (ページキャッシュを含む) なので、limits を絞る。
  resources:
    limits:
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 512Mi
  storage:
    pvcTemplate:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 8Gi
      selector:
        matchLabels:
          name: kotatsu-db-data
      storageClassName: local

---
apiVersion: v1
kind: Service
metadata:
  name: postgresql

spec:
  type: NodePort
  selector:
    cnpg.io/cluster: kotatsu-db
    cnpg.io/instanceRole: primary
  ports:
    - name: tcp-postgresql
      port: 5432
      targetPort: 5432
      nodePort: 5433
