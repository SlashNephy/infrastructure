apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment

spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          image: guacamole/guacamole:1.6.0@sha256:f344085e618bb05e22b964b0208dbd06d3468275bac70206f93805245e067b40
          env:
            - name: TZ
              value: Asia/Tokyo
            # guacd は同一 Pod の 2 つ目のコンテナとして動かす
            - name: GUACD_HOSTNAME
              value: 127.0.0.1
            - name: GUACD_PORT
              value: "4822"
            # 既定では /guacamole に配信されるため、ROOT を指定して / に置く
            - name: WEBAPP_CONTEXT
              value: ROOT
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/guacamole/user-mapping.xml
              readOnly: true
              subPath: user-mapping.xml
            # entrypoint が GUACAMOLE_HOME と CATALINA_BASE を /tmp 配下に mktemp するため、
            # readOnlyRootFilesystem のままでは書き込み先が要る
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1001
            runAsUser: 1001
          startupProbe:
            # Tomcat の起動と webapp の展開に時間がかかる
            failureThreshold: 30
            httpGet:
              path: /
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 5
        - name: guacd
          image: guacamole/guacd:1.6.0@sha256:8974eaa9ba32f713daf311e7cc8cd7e4cdfba1edea39eed75524e78ef4b08f4f
          env:
            - name: TZ
              value: Asia/Tokyo
          ports:
            - containerPort: 4822
          volumeMounts:
            - name: guacd-tmp
              mountPath: /tmp
          livenessProbe:
            periodSeconds: 30
            tcpSocket:
              port: 4822
            timeoutSeconds: 5
          readinessProbe:
            periodSeconds: 10
            tcpSocket:
              port: 4822
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsUser: 1000
      volumes:
        - name: config
          secret:
            secretName: secret
        - name: tmp
          emptyDir: {}
        - name: guacd-tmp
          emptyDir: {}
      restartPolicy: Always
      hostname: guacamole
      securityContext:
        seccompProfile:
          type: RuntimeDefault
