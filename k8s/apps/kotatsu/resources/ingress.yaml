apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: route

spec:
  routes:
    # bot のクロールを抑止するため robots.txt を返す。
    - kind: Rule
      match: Host(`kotatsu.starry.blue`) && Path(`/robots.txt`)
      priority: 100
      services:
        - name: robots-txt
          namespace: traefik
          port: http

    - kind: Rule
      match: Host(`kotatsu.starry.blue`)
      priority: 10
      services:
        - name: kotatsu
          port: http
      middlewares:
        - name: forward-auth-authentik
          namespace: authentik

    - kind: Rule
      match: Host(`kotatsu.starry.blue`) && PathPrefix(`/outpost.goauthentik.io/`)
      priority: 15
      services:
        - name: authentik-server
          namespace: authentik
          port: http

    - kind: Rule
      match: Host(`kotatsu.starry.blue`) && (PathPrefix(`/api`) || Path(`/mcp`) || PathPrefix(`/oauth`) || PathPrefix(`/.well-known`) || Path(`/healthz`))
      priority: 20
      services:
        - name: kotatsu
          port: http

---
# River UI (river-ui.yaml) は別のホストで開く。Authentik の forward-auth で Admin だけを通す (authentik.yaml の kotatsu-river)。
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: route-river

spec:
  routes:
    # bot のクロールを抑止するため robots.txt を返す。
    - kind: Rule
      match: Host(`kotatsu-river.starry.blue`) && Path(`/robots.txt`)
      priority: 100
      services:
        - name: robots-txt
          namespace: traefik
          port: http

    - kind: Rule
      match: Host(`kotatsu-river.starry.blue`)
      priority: 10
      services:
        - name: river-ui
          port: http
      middlewares:
        - name: forward-auth-authentik
          namespace: authentik

    - kind: Rule
      match: Host(`kotatsu-river.starry.blue`) && PathPrefix(`/outpost.goauthentik.io/`)
      priority: 15
      services:
        - name: authentik-server
          namespace: authentik
          port: http
