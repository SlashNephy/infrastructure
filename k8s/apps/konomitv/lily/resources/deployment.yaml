apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment

spec:
  replicas: 1
  selector:
    matchLabels:
      app: default
  template:
    metadata:
      labels:
        app: default
    spec:
      containers:
        - name: app
          # latest は --adapt-resolution を渡すサーバーコードと、そのオプションを持たない
          # QSVEncC 8.16 を同梱しており、ライブ視聴時にエンコーダーが即座に落ちる。
          # 上流はオプション導入 (fc98a36) の 4 日後に QSVEncC を 8.26 へ更新した (8cb8df8) が、
          # まだイメージを再ビルドしていない。
          #
          # latest の過去の digest はレジストリに残っていないため戻せない。
          # リリースビルドはサーバーコードと同梱エンコーダーの組み合わせが整合しており、
          # マイグレーションも master と同一 (11_20260604000000_update.py で終端) なので、
          # 上流が再ビルドするまでリリースタグに固定する。
          image: ghcr.io/tsukumijima/konomitv:v0.14.1@sha256:3c27362b49da1047593ef933d9ffad247f965627507c0c6c3ec0269b06e6e8b8
          volumeMounts:
            - name: config
              mountPath: /code/config.yaml
              readOnly: true
              subPath: config.yaml
            - name: data
              mountPath: /code/server/data
            - name: records
              mountPath: /mnt/records
              readOnly: true
            - name: records-local
              mountPath: /mnt/records_local
              readOnly: true
            - name: logs
              mountPath: /code/server/logs
          resources:
            limits:
              gpu.intel.com/i915: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      volumes:
        - name: config
          configMap:
            name: app-config
        - name: data
          hostPath:
            path: /mnt/local/konomitv/data
            type: DirectoryOrCreate
        - name: records
          hostPath:
            path: /mnt/pool/records
            type: Directory
        - name: records-local
          hostPath:
            path: /mnt/pool/records_local
            type: Directory
        - name: logs
          emptyDir: {}
      restartPolicy: Always
      securityContext:
        seccompProfile:
          type: RuntimeDefault
