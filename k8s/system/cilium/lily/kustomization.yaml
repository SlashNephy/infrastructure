apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kube-system

helmCharts:
  # https://docs.cilium.io/en/stable/installation/k8s-install-helm/
  # https://github.com/cilium/cilium/blob/main/install/kubernetes/cilium/values.yaml
  - name: cilium
    releaseName: cilium
    namespace: kube-system
    version: 1.20.1
    repo: https://helm.cilium.io
    includeCRDs: true
    valuesInline:
      # MTU を明示しないと、Cilium は検出したデバイスの最小 MTU を採る。
      # lily では tailscale0 (1280) が検出対象に入るため Pod が 1280 に張り付き、
      # enp1s0 の 9000 がまったく活かされていなかった。
      # tailscale0 を devices から外す案は、tailnet 経由の NodePort と
      # pod -> tailnet の BPF masquerade の両方を壊すため採れない。
      # 実測でスイッチは 9018 バイトフレームを通す (gw のみ 1500)。
      MTU: 9000
      autoDirectNodeRoutes: true
      bpf:
        masquerade: true
      enableIPv4BIGTCP: true
      enableIPv4Masquerade: true
      enableIPv6BIGTCP: true
      enableIPv6Masquerade: true
      envoy:
        enabled: false
      # endpoint-create API の既定は rate-limit 0.5/s, parallel-requests 4,
      # max-wait-duration 15s。lily は 160 Pod が 1 ノードに載っているため
      # ノード再起動時に endpoint 作成が殺到し、15 秒待ちきれなかった CNI ADD が
      # 429 putEndpointIdTooManyRequests で落ちる。kubelet が sandbox 作成を
      # backoff 付きでリトライするので最終的には収束するが、その間 Pod の起動順が
      # 大きく乱れる。待たされること自体は害がないため、まず待機上限のみ緩める。
      # https://docs.cilium.io/en/stable/configuration/api-rate-limiting/
      extraConfig:
        api-rate-limit: endpoint-create=max-wait-duration:2m
      hostPort:
        enabled: true
      hubble:
        preferIpv6: true
        relay:
          enabled: true
        ui:
          enabled: true
      ipMasqAgent:
        config:
          nonMasqueradeCIDRs:
            - 10.0.0.0/16
            - fdac:2d12:9f5::/64
        enabled: true
      ipv4NativeRoutingCIDR: 10.0.0.0/16
      ipv6:
        enabled: true
      ipv6NativeRoutingCIDR: fdac:2d12:9f5::/64
      k8s:
        requireIPv4PodCIDR: true
        requireIPv6PodCIDR: true
      k8sServiceHost: 192.168.1.2
      k8sServicePort: 6443
      kubeProxyReplacement: true
      loadBalancer:
        acceleration: best-effort
        mode: hybrid
      operator:
        prometheus:
          enabled: true
        replicas: 1
      # loadBalancer.mode: hybrid なので TCP は DSR で返る。DSR 経路は
      # オプション分だけパケットが伸びるため、MTU いっぱいで届いたパケットは
      # device_mtu を超えて DROP_FRAG_NEEDED になる。この値を入れないと
      # silent drop になり、入れるとクライアントに ICMP fragmentation-needed が
      # 返って PMTU が下がる (enable-pmtu-discovery -> ENABLE_DSR_ICMP_ERRORS)。
      # MTU 9000 に揃えた LAN クライアントから NodePort を叩く経路で効く。
      pmtuDiscovery:
        enabled: true
      prometheus:
        enabled: true

      routingMode: native
      socketLB:
        hostNamespaceOnly: true
resources:
  - ./resources/authentik.yaml
  - ./resources/dns.yaml
  - ./resources/ingress.yaml
