apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kube-system

helmCharts:
  # https://docs.cilium.io/en/stable/installation/k8s-install-helm/
  # https://github.com/cilium/cilium/blob/main/install/kubernetes/cilium/values.yaml
  - name: cilium
    releaseName: cilium
    namespace: kube-system
    version: 1.20.2
    repo: https://helm.cilium.io
    includeCRDs: true
    valuesInline:
      # MTU を明示しないと、Cilium は検出したデバイスの最小 MTU を採る。
      # かつてホストで動かしていた tailscaled の tailscale0 (1280) が検出対象に入り、
      # Pod が 1280 に張り付いて enp1s0 の 9000 がまったく活かされていなかった。
      # tailnet への経路は tailscale-operator と mahiron/tailnet-green の Pod に移し、
      # tailscale0 は各 Pod のネットワーク名前空間にしか無い。
      # ホストに MTU の小さいデバイスが増えても引きずられないよう、明示したままにする。
      # 実測でスイッチは 9018 バイトフレームを通す (gw のみ 1500)。
      MTU: 9000
      autoDirectNodeRoutes: true
      bpf:
        masquerade: true
      enableIPv4BIGTCP: true
      enableIPv4Masquerade: true
      enableIPv6BIGTCP: true
      enableIPv6Masquerade: true
      envoy:
        enabled: false
      # endpoint-create API の既定は rate-limit 0.5/s, parallel-requests 4,
      # max-wait-duration 15s。lily は 160 Pod が 1 ノードに載っているため
      # ノード再起動時に endpoint 作成が殺到し、15 秒待ちきれなかった CNI ADD が
      # 429 putEndpointIdTooManyRequests で落ちる。kubelet が sandbox 作成を
      # backoff 付きでリトライするので最終的には収束するが、その間 Pod の起動順が
      # 大きく乱れる。待たされること自体は害がないため、まず待機上限のみ緩める。
      # https://docs.cilium.io/en/stable/configuration/api-rate-limiting/
      extraConfig:
        api-rate-limit: endpoint-create=max-wait-duration:2m
      hostPort:
        enabled: true
      hubble:
        preferIpv6: true
        relay:
          enabled: true
        ui:
          enabled: true
      # Pod の IP は cluster-pool IPAM が CiliumNode に割り当てる。プールを明示しないとチャートの既定値
      # (10.0.0.0/8, fd00::/104) が使われ、ipv4NativeRoutingCIDR などで宣言した範囲と食い違っていた。
      # 既存の割り当て (10.0.0.0/24, fd00::/120) を含む範囲にしてあるので、Pod の IP は変わらない。
      # kubeadm の podSubnet (k8s/init/lily/kubeadm-config.yaml) も同じ範囲にそろえる
      ipMasqAgent:
        config:
          nonMasqueradeCIDRs:
            - 10.0.0.0/16
            - fd00::/104
        enabled: true
      ipam:
        operator:
          clusterPoolIPv4MaskSize: 24
          clusterPoolIPv4PodCIDRList:
            - 10.0.0.0/16
          clusterPoolIPv6MaskSize: 120
          clusterPoolIPv6PodCIDRList:
            - fd00::/104
      ipv4NativeRoutingCIDR: 10.0.0.0/16
      ipv6:
        enabled: true
      ipv6NativeRoutingCIDR: fd00::/104
      k8sServiceHost: 192.168.1.2
      k8sServicePort: 6443
      kubeProxyReplacement: true
      loadBalancer:
        acceleration: best-effort
        mode: hybrid
      operator:
        prometheus:
          enabled: true
        replicas: 1
      # loadBalancer.mode: hybrid なので TCP は DSR で返る。DSR 経路は
      # オプション分だけパケットが伸びるため、MTU いっぱいで届いたパケットは
      # device_mtu を超えて DROP_FRAG_NEEDED になる。この値を入れないと
      # silent drop になり、入れるとクライアントに ICMP fragmentation-needed が
      # 返って PMTU が下がる (enable-pmtu-discovery -> ENABLE_DSR_ICMP_ERRORS)。
      # MTU 9000 に揃えた LAN クライアントから NodePort を叩く経路で効く。
      pmtuDiscovery:
        enabled: true
      prometheus:
        enabled: true

      routingMode: native
      socketLB:
        hostNamespaceOnly: true
resources:
  - ./resources/authentik.yaml
  - ./resources/dns.yaml
  - ./resources/ingress.yaml
