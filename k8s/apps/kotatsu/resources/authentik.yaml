apiVersion: authentik.starry.blue/v1alpha1
kind: AuthentikApplication
metadata:
  name: kotatsu-frontend

spec:
  access:
    rules:
      - group:
          name: Nerd
  adopt: IfMatch
  group: DTV
  hideFromApplicationDashboard: true
  icon: https://raw.githubusercontent.com/SlashNephy/kotatsu/main/frontend/public/icons/icon-512.png
  name: kotatsu.starry.blue
  provider:
    name: kotatsu.starry.blue
    flows:
      authentication:
        slug: sign-in
      authorization:
        slug: authorize
      invalidation:
        slug: default-provider-invalidation-flow
    proxy:
      accessTokenValidity: days=7
      forwardAuthSingle:
        externalHost: https://kotatsu.starry.blue
      interceptHeaderAuth: true
      outpost:
        name: authentik Embedded Outpost
      refreshTokenValidity: days=30
  slug: kotatsu-frontend

---
apiVersion: authentik.starry.blue/v1alpha1
kind: AuthentikApplication
metadata:
  name: kotatsu

spec:
  access:
    rules:
      - group:
          name: Nerd
  group: DTV
  icon: https://raw.githubusercontent.com/SlashNephy/kotatsu/main/frontend/public/icons/icon-512.png
  launchURL: https://kotatsu.starry.blue
  name: Kotatsu
  provider:
    name: Kotatsu
    flows:
      authentication:
        slug: sign-in
      authorization:
        slug: authorize
      invalidation:
        slug: default-provider-invalidation-flow
    oauth2:
      accessCodeValidity: minutes=1
      accessTokenValidity: hours=1
      clientType: Confidential
      credentials:
        secretRef:
          name: kotatsu-oidc
          clientIDKey: KOTATSU_AUTH_OIDC_CLIENT_ID
          clientSecretKey: KOTATSU_AUTH_OIDC_CLIENT_SECRET
      grantTypes:
        - AuthorizationCode
      includeClaimsInIDToken: true
      issuerMode: PerProvider
      logoutMethod: BackChannel
      redirectURIs:
        - matchingMode: Strict
          type: Authorization
          url: https://kotatsu.starry.blue/internal/auth/oidc/callback
      refreshTokenThreshold: seconds=0
      refreshTokenValidity: days=30
      scopes:
        - scopeName: openid
        - scopeName: email
        - scopeName: profile
      signingKey:
        name: id.starry.blue
      subjectMode: HashedUserID
  slug: kotatsu
