# traefik 経由の外部クライアントと、書き込む telegraf、読む grafana だけを通す。
# kubelet の probe はホストから届き、Cilium はホストからの通信を既定で許可するため書かない。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingress

spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: telegraf
          podSelector:
            matchLabels:
              app: default
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: grafana
          podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        - port: 8086
          protocol: TCP
  podSelector: {}
  policyTypes:
    - Ingress
