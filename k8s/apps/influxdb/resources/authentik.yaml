apiVersion: authentik.starry.blue/v1alpha1
kind: AuthentikApplication
metadata:
  name: influxdb

spec:
  access:
    rules:
      - group:
          name: Admin
  adopt: IfMatch
  group: Observability
  icon: https://github.com/influxdata.png
  name: InfluxDB
  provider:
    name: InfluxDB
    flows:
      authorization:
        slug: authorize
      invalidation:
        slug: default-provider-invalidation-flow
    proxy:
      accessTokenValidity: days=1
      forwardAuthSingle:
        externalHost: https://influxdb.starry.blue
      interceptHeaderAuth: true
      outpost:
        name: authentik Embedded Outpost
      refreshTokenValidity: days=30
  slug: influxdb
