apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kubeclarity

images:
  # Bitnami は 2025-08 にバージョン固定タグを有償枠へ移したため、チャート既定の
  # docker.io/bitnami/postgresql:14.6.0-debian-11-r31 は既に pull できない。
  # 現在はノードのイメージキャッシュで動いているだけで、再スケジュールされると起動できない。
  # 無償でバージョンを固定できるのは凍結済みの bitnamilegacy だけなので、そこに固定する。
  - name: docker.io/bitnami/postgresql
    newName: docker.io/bitnamilegacy/postgresql
    newTag: 14.10.0-debian-11-r31@sha256:147741dd7bf950ba8166136422f8653c25886652ae40335f498de8c45304443b

helmCharts:
  - name: kubeclarity
    releaseName: kubeclarity
    namespace: kubeclarity
    version: v2.23.3
    repo: https://openclarity.github.io/kubeclarity

resources:
  - ./resources/dns.yaml
  - ./resources/ingress.yaml
  - ./resources/namespace.yaml

patches:
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: kubeclarity-kubeclarity-postgresql
    patch: |
      - op: remove
        path: /spec/volumeClaimTemplates
      - op: add
        path: /spec/template/spec/volumes/1
        value:
          name: data
          hostPath:
            path: /mnt/local/kubeclarity/postgresql
            type: DirectoryOrCreate
      # Bitnami の PostgreSQL イメージは STOPSIGNAL を設定しておらず、PID 1 の postgres は
      # SIGTERM を smart shutdown (既存クライアントが自ら切断するまで待つ) と解釈する。
      # kubeclarity がコネクションを保持し続けるので待機が終わらず、
      # terminationGracePeriodSeconds 満了で SIGKILL され、毎回クラッシュリカバリになる。
      # 他アプリ (#9876) はチャートの primary.lifecycleHooks で対処したが、
      # ここは sub-chart で values を渡せないため patch で当てる。
      - op: add
        path: /spec/template/spec/containers/0/lifecycle
        value:
          preStop:
            exec:
              command:
                - /bin/sh
                - -c
                # terminationGracePeriodSeconds (30 秒) を超えないよう -t で頭打ちにする
                - pg_ctl stop -D "$PGDATA" -m fast -w -t 25
