apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kotatsu

# Kotatsu を、ロールごとに Pod を分ける split で動かす。mikan を 2 つにして、更新の間も録画を途切れさせない。
helmCharts:
  - name: kotatsu
    releaseName: kotatsu
    namespace: kotatsu
    version: 2026.11.5
    repo: https://slashnephy.github.io/kotatsu
    valuesInline:
      # nekonote が、DB とキャプチャの画像を暗号化して定期に書き出す先 (Kotatsu の設計書 11.4)。
      # 公開鍵、間隔、残す世代の数は、管理者の画面 (/admin/backup) で決める。公開鍵を登録するまでは書き出さない。
      # 稼働中の DB のデータディレクトリ (/mnt/local/kotatsu/db) は、生のファイルでは整合が取れないので、Lily のホストのバックアップ
      # (maintenance-backup-local、毎日 04:30) から外してある。代わりに、ここに書き出したファイルがホストのバックアップに入り、pool とオフサイトに送られる。
      # 持ち主は uid 1000。前の pg_dump の CronJob が残した kotatsu-*.dump は、Kotatsu が消さないので残る。
      backup:
        volume:
          hostPath:
            path: /mnt/local/kotatsu/db-backup
            type: Directory
      config:
        # Application に入れる人 (Nerd) は、初めてのログインでメンバーとして作る。
        # 管理者は、既存のユーザーに kotatsu user link-oidc で紐付ける。
        AUTH_OIDC_AUTO_CREATE_ENABLED: "true"
        AUTH_OIDC_AUTO_CREATE_MEMBER_GROUPS: Nerd
        AUTH_OIDC_DISPLAY_NAME: id.starry.blue
        AUTH_OIDC_ISSUER: https://id.starry.blue/application/o/kotatsu/
        # kyusu のライブ視聴の変換を、ソフトウェアの x264 から Lily の Intel の GPU (VAAPI) に移す。
        # x264 では BS4K を実時間で変換できず、Mahiron の受け手のキューが溢れて再生が止まっていた。
        # 録画の MP4 への変換 (nekonote) も同じ設定を使うので、GPU は generic-device-plugin の devic.es/dri で kyusu と nekonote に渡す。
        KYUSU_ENCODER: vaapi
        # 外からは traefik を経て届き、認証の前段は authentik が担う。
        # 送信元の判定は traefik (Pod のネットワーク) が付ける X-Forwarded-For に頼る。
        # 2026.11.5 で SERVER_ALLOWED_NETWORKS が家の中と外に分かれた。家の中 (RFC 1918 など) の範囲は既定で受けるので、外の範囲だけを書く。
        SERVER_ALLOWED_EXTERNAL_NETWORKS: 0.0.0.0/0,::/0
        SERVER_TRUSTED_PROXIES: 10.0.0.0/16
        TUNER_URL: http://app.mahiron:40772/
      # メトリクスを OTLP で Mackerel に送るときのヘッダー。Secret の kotatsu-mackerel (secret.yaml) は API キーだけを持つので、
      # Kubernetes の変数の展開で「名前=値」の形に組み立てる。展開する変数は、先に定義しておく。
      # extraEnv はマイグレーションの Job (PreSync) にも入る。Job は Secret を作る OnePasswordItem より先に動くので、
      # Secret がなくても起動できるよう optional にする。マイグレーションはメトリクスを送らない。
      extraEnv:
        - name: MACKEREL_API_KEY
          valueFrom:
            secretKeyRef:
              name: kotatsu-mackerel
              key: Mackerel-Api-Key
              optional: true
        - name: KOTATSU_TELEMETRY_OTLP_METRICS_HEADERS
          value: Mackerel-Api-Key=$(MACKEREL_API_KEY)
      # client ID と client secret は、operator が作る Secret の kotatsu-oidc から読む (authentik.yaml)。
      extraEnvFrom:
        - secretRef:
            name: kotatsu-oidc
      # メトリクスを、Mackerel のラベル付きメトリクスに OTLP/gRPC で直接送る (Kotatsu の設計書 11.3)。
      # Mackerel は系列の数で課金されるので、Go のランタイムとプロセスのメトリクスは送らない。/metrics には残る。
      metrics:
        otlp:
          endpoint: https://otlp.mackerelio.com:4317
          exclude:
            - go_*
            - process_*
      mode: split
      # Pod への Ingress を絞る (Cilium が NetworkPolicy を実装する)。tenban の http は traefik からだけ受け、
      # kyusu の http は tenban からだけ受ける。ほかのロールの http と、全ロールの metrics は誰からも受けない。
      # メトリクスは OTLP で Mackerel に送り、/metrics を読む相手はいないので、metricsFrom は空にする。
      # kubelet のプローブは、Cilium がホストからの通信として通す。
      networkPolicy:
        enabled: true
        httpFrom:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: traefik
      # mackerel-container-agent を全ロールの Pod に注入する (resources/mackerel-agent.yaml)。
      # 注入は mackerel-operator が Pod の label と annotation を見て行う。マイグレーションの Job には Chart が付けない。
      podAnnotations:
        agent.mackerel.starry.blue/apikey-secret-name: mackerel-agent-api-key
      podLabels:
        agent.mackerel.starry.blue/inject: "true"
      # Chart の既定の uid (65532) では、録画の置き場所に書けない。fsGroup も合わせないと、Chart の既定の 65532 が残る。
      podSecurityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      priorityClassName: recording
      # Lily は CPU が飽和しがちなので、Chart の既定 (1 秒) より長く応答を待つ。
      probes:
        liveness:
          failureThreshold: 4
          periodSeconds: 30
          timeoutSeconds: 5
        readiness:
          timeoutSeconds: 5
      # resources は Chart の既定値 (本番の split の実測に寄せた値) を使う。FFmpeg を使う kyusu と nekonote だけ、
      # GPU を足し、メモリの limits を Chart の既定 (4Gi) より小さい 2Gi にする。
      roles:
        kyusu:
          podAnnotations:
            agent.mackerel.starry.blue/roles: kotatsu:kyusu
          replicas: 1
          resources:
            limits:
              # VAAPI の render ノード (/dev/dri/renderD128)。拡張リソースは limits に書く
              devic.es/dri: 1
              memory: 2Gi
          # HLS のセグメントと FFmpeg の作業ファイルを置く。
          workSizeLimit: 8Gi
        mikan:
          podAnnotations:
            agent.mackerel.starry.blue/roles: kotatsu:mikan
          replicas: 2
        neko:
          podAnnotations:
            agent.mackerel.starry.blue/roles: kotatsu:neko
          # Chart の既定 (512Mi) では、2026-11-21 に 20 時間で 5 回再起動し、直近の 1 回は OOMKilled だった。
          # 原因を調べ終えるまで、limits を 1Gi に上げて落ちないようにする。
          resources:
            limits:
              memory: 1Gi
        nekonote:
          podAnnotations:
            agent.mackerel.starry.blue/roles: kotatsu:nekonote
          resources:
            limits:
              # 録画の MP4 への変換も、kyusu と同じエンコーダーの設定 (KYUSU_ENCODER) を使うので、GPU を渡す
              devic.es/dri: 1
              memory: 2Gi
        # tenban は 1 台にする。RollingUpdate なので、更新の間も新しい Pod が ready になってから古い Pod を止める。
        tenban:
          podAnnotations:
            agent.mackerel.starry.blue/roles: kotatsu:tenban
          replicas: 1
      secrets:
        databaseURL:
          name: kotatsu-db-app
          key: uri
        secretKey:
          name: kotatsu
          key: KOTATSU_AUTH_SECRET_KEY
      # agent が kubelet を読むための ServiceAccount (resources/mackerel-agent.yaml)。Kotatsu 自体は Kubernetes の API を使わない。
      serviceAccountName: mackerel-container-agent
      storage:
        # 索引、代表画像、プレビュー画像などの生成物。持ち主は uid 1000。
        data:
          volume:
            hostPath:
              path: /mnt/local/kotatsu/data
              type: Directory
        # /mnt/pool/records の持ち主は uid 1000 なので、同じ uid で書く。
        # local の PV にすると、kubelet が fsGroup でディレクトリ全体の持ち主を書き換えうるので、hostPath で渡す。
        pools:
          - id: main
            volume:
              hostPath:
                path: /mnt/pool/records
                type: Directory
          # local は、クラウドに同期しない録画の置き場所。EPGStation の「Drive 同期なし」にあたる。
          - id: local
            volume:
              hostPath:
                path: /mnt/pool/records_local
                type: Directory
        # タイムシフトのバッファ (放送を保持時間だけ残すチャンク)。プールと同じファイルシステムに置くが、プールにはしない。
        # 録画のプール (/mnt/pool/records) の外に置く。Kotatsu はプールやデータディレクトリと重なる場所を拒む。持ち主は uid 1000。
        timeshift:
          volume:
            hostPath:
              path: /mnt/pool/records_timeshift
              type: Directory

resources:
  - ./resources/authentik.yaml
  - ./resources/cronjob-copy.yaml
  - ./resources/database.yaml
  - ./resources/dns.yaml
  - ./resources/ingress.yaml
  - ./resources/mackerel-agent.yaml
  - ./resources/namespace.yaml
  - ./resources/river-ui.yaml
  - ./resources/secret.yaml
  - ./resources/volume.yaml
