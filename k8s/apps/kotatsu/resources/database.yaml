# Kotatsu の PostgreSQL。HA は目指さない (lily は単一ノードで PV も local のため)。
# 接続先は、CloudNativePG が作る Secret kotatsu-db-app の uri を使う。
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: kotatsu-db

spec:
  bootstrap:
    initdb:
      database: kotatsu
      encoding: UTF8
      owner: kotatsu
  # 拡張を使わず、照合順序も C なので、拡張やロケールを含まない minimal にする。
  # タグは PostgreSQL の版、ビルドの日時、種類、OS の順で、Renovate が版とビルドの両方を追う (renovate.json5)。
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-202610260820-minimal-trixie@sha256:64abc98a4387361afd6821a3a99f975763bbd87bbdde9449e75ad6002528a318
  instances: 1
  postgresql:
    parameters:
      log_timezone: Asia/Tokyo
      timezone: Asia/Tokyo
  # 7 日の実測で、メモリはピークでも 787MiB (ページキャッシュを含む) なので、limits を絞る。
  resources:
    limits:
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 512Mi
  storage:
    pvcTemplate:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 8Gi
      selector:
        matchLabels:
          name: kotatsu-db-data
      storageClassName: local
