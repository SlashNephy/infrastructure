apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argo-cd

spec:
  routes:
    # bot のクロールを抑止するため robots.txt を返す。
    - kind: Rule
      match: Host(`argocd.starry.blue`) && Path(`/robots.txt`)
      priority: 100
      services:
        - name: robots-txt
          namespace: traefik
          port: http

    - kind: Rule
      match: Host(`argocd.starry.blue`)
      priority: 10
      services:
        - name: argo-cd-argocd-server
          # MEMO: リダイレクトループが発生するため、https を使用している
          port: https
          scheme: https
          serversTransport: allow-insecure
      middlewares:
        - name: forward-auth-authentik
          namespace: authentik

    - kind: Rule
      match: Host(`argocd.starry.blue`) && PathPrefix(`/outpost.goauthentik.io/`)
      priority: 15
      services:
        - name: authentik-server
          namespace: authentik
          port: http

    # GitHub からの Webhook と、外形監視の /healthz は認証を迂回させる。
    # lily は Webhook でしか同期しないため、Webhook を塞ぐと同期が止まる。
    - kind: Rule
      match: Host(`argocd.starry.blue`) && (Path(`/api/webhook`) || Path(`/healthz`))
      priority: 20
      services:
        - name: argo-cd-argocd-server
          port: https
          scheme: https
          serversTransport: allow-insecure

---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: allow-insecure

spec:
  insecureSkipVerify: true
