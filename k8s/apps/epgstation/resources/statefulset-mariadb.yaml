apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb

spec:
  replicas: 1
  # selector は不変なので、Bitnami チャートが作っていた値を維持してその場で更新させる
  selector:
    matchLabels:
      app.kubernetes.io/component: primary
      app.kubernetes.io/instance: mariadb
      app.kubernetes.io/name: mariadb
      app.kubernetes.io/part-of: mariadb
  template:
    metadata:
      labels:
        app.kubernetes.io/component: primary
        app.kubernetes.io/instance: mariadb
        app.kubernetes.io/name: mariadb
        app.kubernetes.io/part-of: mariadb
    spec:
      containers:
        - name: mariadb
          image: public.ecr.aws/docker/library/mariadb:12.3.3@sha256:805c8e104bd563d5bfa24fadd3f31cd419ea859cb5277f32b5dbf2db714f9ed1
          # 相対パスでファイルを扱う処理が読み取り専用の / を基準にしないよう、書き込める場所に置く
          workingDir: /tmp
          env:
            # バージョンが上がったときに、起動前に mariadb-upgrade を流す。
            # システム DB は実行前に datadir へ zstd で退避される。
            # Bitnami のイメージは 11.4 → 12.0 の更新時に mariadb-upgrade を流しておらず、
            # mariadb_upgrade_info が 11.4.5 のまま残っていたので、初回の起動でも実行される。
            - name: MARIADB_AUTO_UPGRADE
              value: "1"
            - name: TZ
              value: Asia/Tokyo
          ports:
            - name: mysql
              containerPort: 3306
          volumeMounts:
            - name: data
              mountPath: /bitnami/mariadb
            - name: config
              mountPath: /etc/mysql/conf.d
              readOnly: true
            - name: run
              mountPath: /run/mysqld
            - name: tmp
              mountPath: /tmp
          resources:
            limits:
              cpu: "1.5"
              ephemeral-storage: 2Gi
              memory: 3072Mi
            requests:
              cpu: "1.0"
              ephemeral-storage: 50Mi
              memory: 2048Mi
          # healthcheck.sh は datadir の .my-healthcheck.cnf (初回の起動時に作られる専用ユーザー) で接続する。
          # 探す場所が既定の /var/lib/mysql に固定されているので、明示して渡す。
          livenessProbe:
            exec:
              command: [healthcheck.sh, --defaults-extra-file=/bitnami/mariadb/data/.my-healthcheck.cnf, --connect, --innodb_initialized]
            failureThreshold: 5
            periodSeconds: 60
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command: [healthcheck.sh, --defaults-extra-file=/bitnami/mariadb/data/.my-healthcheck.cnf, --connect, --innodb_initialized]
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            # 既存データの所有者が 1001 なので合わせる
            runAsGroup: 1001
            runAsNonRoot: true
            runAsUser: 1001
          # 初回の起動とバージョンの更新時は、mariadbd の前に mariadb-upgrade が走る。
          # その間に liveness で落とされないよう、起動完了までは startupProbe だけで見る (最大 5 分)。
          startupProbe:
            exec:
              command: [healthcheck.sh, --defaults-extra-file=/bitnami/mariadb/data/.my-healthcheck.cnf, --connect, --innodb_initialized]
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: epgstation-mariadb-data
        - name: config
          configMap:
            name: mariadb
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: mariadb
  # serviceName も不変。チャートが作っていた headless Service の名前を維持する
  serviceName: mariadb-headless
