name: Deploy curl-jq

on:
  push:
    paths:
      - cmd/curl-jq/**
  workflow_dispatch:

permissions: {}

jobs:
  build:
    uses: SlashNephy/actions/.github/workflows/build-docker-image.yml@70aa7999543c0745815c8233fd18fc1759748f6c # v1.0.0
    permissions:
      contents: read
      packages: write
      actions: read
      security-events: write
    with:
      context: cmd/curl-jq
      image-name: ghcr.io/slashnephy/curl-jq
      image-platforms: linux/amd64
      dispatch-update-image-digest: true
    secrets:
      dispatch-app-private-key: ${{ secrets.DISPATCH_APP_PRIVATE_KEY }}

  # 一時的な検証ジョブ。App トークンの権限確認後に削除する。
  verify-app-token:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23liKChiFOA2aFE8Wa # slashnephy-infrastructure
          private-key: ${{ secrets.DISPATCH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create branch and pull request
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          base_sha=$(gh api "repos/$REPO/git/ref/heads/master" --jq .object.sha)
          tree=$(gh api "repos/$REPO/git/commits/$base_sha" --jq .tree.sha)
          branch="ci/app-token-check-$GITHUB_RUN_ID"

          commit=$(gh api "repos/$REPO/git/commits" -f message="chore: verify app token permissions" -f tree="$tree" -f "parents[]=$base_sha" --jq .sha)
          gh api "repos/$REPO/git/refs" -f "ref=refs/heads/$branch" -f "sha=$commit" --jq .ref

          url=$(gh pr create --base master --head "$branch" --title "chore: verify app token permissions" --body "App トークンの権限確認用。すぐ閉じます。")
          echo "number=${url##*/}" >> "$GITHUB_OUTPUT"

      - name: Close pull request
        if: always() && steps.pr.outputs.number
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: gh pr close "$PR_NUMBER" --delete-branch --comment "権限確認が完了したため閉じます。"
