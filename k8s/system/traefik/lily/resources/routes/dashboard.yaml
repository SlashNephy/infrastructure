apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: dashboard-route

spec:
  routes:
    - kind: Rule
      match: Host(`traefik.starry.blue`)
      priority: 10
      services:
        - name: api@internal
          kind: TraefikService
      middlewares:
        - name: auto-detect-content-type
        - name: forward-auth-authentik
          namespace: authentik

    - kind: Rule
      match: Host(`traefik.starry.blue`) && PathPrefix(`/outpost.goauthentik.io/`)
      priority: 15
      services:
        - name: authentik-server
          namespace: authentik
          port: http

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: auto-detect-content-type

spec:
  contentType: {}

---
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: dns-dashboard

spec:
  endpoints:
    - dnsName: traefik.starry.blue
      providerSpecific:
        - name: external-dns.alpha.kubernetes.io/cloudflare-proxied
          value: "true"
      recordTTL: 1 # Auto
      recordType: CNAME
      targets:
        - gateway.starry.blue

---
apiVersion: mackerel.starry.blue/v1alpha1
kind: ExternalMonitor
metadata:
  name: https

spec:
  certificationExpirationCritical: 7
  certificationExpirationWarning: 30
  expectedStatusCode: 302 # TODO: アプリケーションに到達できるようにし 200 を確認する
  method: GET
  responseTimeCritical: 10000
  responseTimeDuration: 5
  responseTimeWarning: 5000
  service: Production
  url: https://traefik.starry.blue/health
