apiVersion: authentik.starry.blue/v1alpha1
kind: AuthentikApplication
metadata:
  name: tar1090

spec:
  access:
    rules:
      - group:
          name: Admin
  adopt: IfMatch
  group: Personal
  name: tar1090
  provider:
    name: tar1090
    flows:
      authorization:
        slug: authorize
      invalidation:
        slug: default-provider-invalidation-flow
    proxy:
      accessTokenValidity: days=1
      forwardAuthSingle:
        externalHost: https://1090.starry.blue
      interceptHeaderAuth: true
      outpost:
        name: authentik Embedded Outpost
      refreshTokenValidity: days=30
  slug: tar1090
