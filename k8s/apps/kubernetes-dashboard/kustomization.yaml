apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kubernetes-dashboard

helmCharts:
  # https://artifacthub.io/packages/helm/k8s-dashboard/kubernetes-dashboard
  - name: kubernetes-dashboard
    releaseName: kubernetes-dashboard
    namespace: kubernetes-dashboard
    version: 7.14.0
    repo: https://kubernetes-retired.github.io/dashboard/
    # chart 既定のメモリ (requests 200Mi / limits 400Mi) は実使用量 (直近 30 日の最大で 55Mi 以下) に対して過大
    valuesInline:
      api:
        containers:
          resources:
            limits:
              cpu: 250m
              memory: 128Mi
            requests:
              cpu: 100m
              memory: 64Mi
      auth:
        containers:
          resources:
            limits:
              cpu: 250m
              memory: 128Mi
            requests:
              cpu: 100m
              memory: 64Mi
      metricsScraper:
        containers:
          resources:
            limits:
              cpu: 250m
              memory: 128Mi
            requests:
              cpu: 100m
              memory: 64Mi
      web:
        containers:
          resources:
            limits:
              cpu: 250m
              memory: 128Mi
            requests:
              cpu: 100m
              memory: 64Mi

resources:
  - ./resources/account.yaml
  - ./resources/authentik.yaml
  - ./resources/dns.yaml
  - ./resources/ingress.yaml
  - ./resources/namespace.yaml
  - ./resources/role-binding.yaml
  - ./resources/secret.yaml

patches:
  - path: ./resources/patch-service.yaml
