apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: route

spec:
  routes:
    # bot のクロールを抑止するため robots.txt を返す。
    - kind: Rule
      match: Host(`navidrome.starry.blue`) && Path(`/robots.txt`)
      priority: 100
      services:
        - name: robots-txt
          namespace: traefik
          port: http

    - kind: Rule
      match: Host(`navidrome.starry.blue`)
      priority: 10
      services:
        - name: app
          port: 4533
      middlewares:
        - name: forward-auth-authentik
          namespace: authentik

    - kind: Rule
      match: Host(`navidrome.starry.blue`) && PathPrefix(`/outpost.goauthentik.io/`)
      priority: 15
      services:
        - name: authentik-server
          namespace: authentik
          port: http

    # 外形監視のためヘルスチェック端点のみ認証を迂回させる。
    # authentik の Unauthenticated Paths ではなくここで表現し、設定を可視化する。
    - kind: Rule
      match: Host(`navidrome.starry.blue`) && Path(`/ping`)
      priority: 20
      services:
        - name: app
          port: 4533

    # navidrome は自前の認証を持ち、Subsonic クライアントは SSO を通れない。
    # これらのパスは navidrome 自身の認証に委ね、forward auth を通さない。
    # したがって authentik が守るのは HTML のシェルだけで、API とログインは
    # navidrome の認証で完結する。
    #
    # 以前は authentik の Unauthenticated Paths に置いていたが、設定を可視化する
    # ため、ここへ移した。/ping と同じ方針である。
    #
    # /app/ 自体は forward auth を通す。ここで拾うのは配下の静的アセットと
    # manifest だけである。
    - kind: Rule
      match: >-
        Host(`navidrome.starry.blue`) &&
        (PathPrefix(`/rest/`) || PathPrefix(`/api/`) || PathPrefix(`/auth/`) ||
        PathPrefix(`/static/`) || PathPrefix(`/app/static/`) ||
        Path(`/app/manifest.webmanifest`))
      priority: 20
      services:
        - name: app
          port: 4533
