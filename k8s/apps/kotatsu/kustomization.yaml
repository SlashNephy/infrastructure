apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kotatsu

# Kotatsu を、ロールごとに Pod を分ける split で動かす。mikan を 2 つにして、更新の間も録画を途切れさせない。
helmCharts:
  - name: kotatsu
    releaseName: kotatsu
    namespace: kotatsu
    version: 2026.10.7
    repo: https://slashnephy.github.io/kotatsu
    valuesInline:
      config:
        # Application に入れる人 (Nerd) は、初めてのログインでメンバーとして作る。
        # 管理者は、既存のユーザーに kotatsu user link-oidc で紐付ける。
        AUTH_OIDC_AUTO_CREATE_ENABLED: "true"
        AUTH_OIDC_AUTO_CREATE_MEMBER_GROUPS: Nerd
        AUTH_OIDC_DISPLAY_NAME: id.starry.blue
        AUTH_OIDC_ISSUER: https://id.starry.blue/application/o/kotatsu/
        # 外からは traefik を経て届き、認証の前段は authentik が担う。
        # 送信元の判定は traefik (Pod のネットワーク) が付ける X-Forwarded-For に頼る。
        SERVER_ALLOWED_NETWORKS: 0.0.0.0/0,::/0
        SERVER_TRUSTED_PROXIES: 10.0.0.0/16
        TUNER_URL: http://app.mahiron:40772/
      # メトリクスを OTLP で Mackerel に送るときのヘッダー。Secret の kotatsu-mackerel (secret.yaml) は API キーだけを持つので、
      # Kubernetes の変数の展開で「名前=値」の形に組み立てる。展開する変数は、先に定義しておく。
      # extraEnv はマイグレーションの Job (PreSync) にも入る。Job は Secret を作る OnePasswordItem より先に動くので、
      # Secret がなくても起動できるよう optional にする。マイグレーションはメトリクスを送らない。
      extraEnv:
        - name: MACKEREL_API_KEY
          valueFrom:
            secretKeyRef:
              name: kotatsu-mackerel
              key: Mackerel-Api-Key
              optional: true
        - name: KOTATSU_TELEMETRY_OTLP_METRICS_HEADERS
          value: Mackerel-Api-Key=$(MACKEREL_API_KEY)
      # client ID と client secret は、operator が作る Secret の kotatsu-oidc から読む (authentik.yaml)。
      extraEnvFrom:
        - secretRef:
            name: kotatsu-oidc
      # メトリクスを、Mackerel のラベル付きメトリクスに OTLP/gRPC で直接送る (Kotatsu の設計書 11.3)。
      # Mackerel は系列の数で課金されるので、Go のランタイムとプロセスのメトリクスは送らない。/metrics には残る。
      metrics:
        otlp:
          endpoint: https://otlp.mackerelio.com:4317
          exclude:
            - go_*
            - process_*
      mode: split
      # Chart の既定の uid (65532) では、録画の置き場所に書けない。fsGroup も合わせないと、Chart の既定の 65532 が残る。
      podSecurityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      priorityClassName: recording
      # Lily は CPU が飽和しがちなので、Chart の既定 (1 秒) より長く応答を待つ。
      probes:
        liveness:
          failureThreshold: 4
          periodSeconds: 30
          timeoutSeconds: 5
        readiness:
          timeoutSeconds: 5
      # requests は、全ロールを 1 つの Pod で動かしていたときの実測 (プロセスのメモリが合わせて 100MB 未満) に寄せる。
      # limits は、FFmpeg を使う nekonote と kyusu に余裕を持たせる。
      roles:
        kyusu:
          replicas: 1
          resources:
            limits:
              memory: 2Gi
            requests:
              cpu: 50m
              memory: 128Mi
          # HLS のセグメントと FFmpeg の作業ファイルを置く。
          workSizeLimit: 8Gi
        mikan:
          replicas: 2
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 50m
              memory: 64Mi
        neko:
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 25m
              memory: 64Mi
        nekonote:
          resources:
            limits:
              memory: 2Gi
            requests:
              cpu: 50m
              memory: 128Mi
        # tenban は 1 台にする。RollingUpdate なので、更新の間も新しい Pod が ready になってから古い Pod を止める。
        tenban:
          replicas: 1
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 25m
              memory: 64Mi
      secrets:
        databaseURL:
          name: kotatsu-db-app
          key: uri
        secretKey:
          name: kotatsu
          key: KOTATSU_AUTH_SECRET_KEY
      storage:
        # 索引、代表画像、プレビュー画像などの生成物。持ち主は uid 1000。
        data:
          volume:
            hostPath:
              path: /mnt/local/kotatsu/data
              type: Directory
        # /mnt/pool/records の持ち主は uid 1000 なので、同じ uid で書く。
        # local の PV にすると、kubelet が fsGroup でディレクトリ全体の持ち主を書き換えうるので、hostPath で渡す。
        pools:
          - id: main
            volume:
              hostPath:
                path: /mnt/pool/records
                type: Directory
          # local は、クラウドに同期しない録画の置き場所。EPGStation の「Drive 同期なし」にあたる。
          - id: local
            volume:
              hostPath:
                path: /mnt/pool/records_local
                type: Directory
resources:
  - ./resources/authentik.yaml
  - ./resources/database.yaml
  - ./resources/dns.yaml
  - ./resources/ingress.yaml
  - ./resources/namespace.yaml
  - ./resources/secret.yaml
  - ./resources/volume.yaml
