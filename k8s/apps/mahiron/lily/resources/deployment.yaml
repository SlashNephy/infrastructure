apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment

spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: default
  template:
    metadata:
      labels:
        app: default
    spec:
      containers:
        - name: app
          image: ghcr.io/starrybluesky/mahiron5-custom:master@sha256:0cf35f4c6a8c6a0a6360fb9620a00bf88ff0a2938ccfec3c957fc3c45ff969b1
          # イメージ既定の設定ディレクトリは /app/config のため、明示的に上書きする
          args:
            - -config-dir
            - /etc/mahiron
          env:
            - name: TZ
              value: Asia/Tokyo
          ports:
            - containerPort: 40772
          volumeMounts:
            - name: data
              mountPath: /var/db/mahiron
            - name: config
              mountPath: /etc/mahiron
              readOnly: true
            - name: dev-px4video0
              mountPath: /dev/px4video0
            - name: dev-px4video1
              mountPath: /dev/px4video1
            - name: dev-px4video2
              mountPath: /dev/px4video2
            - name: dev-px4video3
              mountPath: /dev/px4video3
            - name: dev-px4video4
              mountPath: /dev/px4video4
            - name: dev-px4video5
              mountPath: /dev/px4video5
            - name: dev-px4video6
              mountPath: /dev/px4video6
            - name: dev-px4video7
              mountPath: /dev/px4video7
            - name: dev-pxmlt8video0
              mountPath: /dev/pxmlt8video0
            - name: dev-pxmlt8video1
              mountPath: /dev/pxmlt8video1
            - name: dev-pxmlt8video2
              mountPath: /dev/pxmlt8video2
            - name: dev-pxmlt8video3
              mountPath: /dev/pxmlt8video3
            - name: dev-pxmlt8video4
              mountPath: /dev/pxmlt8video4
            - name: dev-pxmlt8video5
              mountPath: /dev/pxmlt8video5
            - name: dev-pxmlt8video6
              mountPath: /dev/pxmlt8video6
            - name: dev-pxmlt8video7
              mountPath: /dev/pxmlt8video7
          securityContext:
            capabilities:
              add:
                - SYS_ADMIN
                - SYS_NICE
            privileged: true
      volumes:
        # 4 系の /mnt/local/mahiron/ は切り戻しの土台として残し、5 系は別ディレクトリを使う
        - name: data
          hostPath:
            path: /mnt/local/mahiron5/data
            type: DirectoryOrCreate
        - name: config
          hostPath:
            path: /mnt/local/mahiron5/config
            type: Directory
        - name: dev-px4video0
          hostPath:
            path: /dev/px4video0
            type: CharDevice
        - name: dev-px4video1
          hostPath:
            path: /dev/px4video1
            type: CharDevice
        - name: dev-px4video2
          hostPath:
            path: /dev/px4video2
            type: CharDevice
        - name: dev-px4video3
          hostPath:
            path: /dev/px4video3
            type: CharDevice
        - name: dev-px4video4
          hostPath:
            path: /dev/px4video4
            type: CharDevice
        - name: dev-px4video5
          hostPath:
            path: /dev/px4video5
            type: CharDevice
        - name: dev-px4video6
          hostPath:
            path: /dev/px4video6
            type: CharDevice
        - name: dev-px4video7
          hostPath:
            path: /dev/px4video7
            type: CharDevice
        - name: dev-pxmlt8video0
          hostPath:
            path: /dev/pxmlt8video0
            type: CharDevice
        - name: dev-pxmlt8video1
          hostPath:
            path: /dev/pxmlt8video1
            type: CharDevice
        - name: dev-pxmlt8video2
          hostPath:
            path: /dev/pxmlt8video2
            type: CharDevice
        - name: dev-pxmlt8video3
          hostPath:
            path: /dev/pxmlt8video3
            type: CharDevice
        - name: dev-pxmlt8video4
          hostPath:
            path: /dev/pxmlt8video4
            type: CharDevice
        - name: dev-pxmlt8video5
          hostPath:
            path: /dev/pxmlt8video5
            type: CharDevice
        - name: dev-pxmlt8video6
          hostPath:
            path: /dev/pxmlt8video6
            type: CharDevice
        - name: dev-pxmlt8video7
          hostPath:
            path: /dev/pxmlt8video7
            type: CharDevice
      restartPolicy: Always
      hostNetwork: true
      imagePullSecrets:
        - name: ghcr-io-credentials
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      # Mahiron は tuner を `sh -c "recpt1 ..."` で起動するが、この sh は exec せず fork するため
      # recpt1 は孫プロセスになる。停止時に Wait されるのは直接の子である sh だけで、
      # 孤児になった recpt1 はコンテナ内 PID 1 (= mahiron 自身) に reparent されて reap されない。
      # PID namespace を共有して PID 1 を pause に譲り、pause に孤児を回収させる。
      shareProcessNamespace: true
