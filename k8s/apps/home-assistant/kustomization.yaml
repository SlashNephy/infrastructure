apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: home-assistant

helmCharts:
  # https://github.com/pajikos/home-assistant-helm-chart
  - name: home-assistant
    releaseName: home-assistant
    namespace: home-assistant
    version: 0.3.88
    # README の pajikos.github.io は HTTPS でも平文 HTTP のこのホストへ 301 するため、リダイレクト先を HTTPS で直接参照する
    repo: https://blog.pavelsklenar.com/home-assistant-helm-chart
    includeCRDs: true
    valuesInline:
      controller:
        type: Deployment
      deploymentStrategy: Recreate
      env:
        - name: TZ
          value: Asia/Tokyo
      persistence:
        enabled: true
        existingClaim: home-assistant-config
      resources:
        limits:
          memory: 1Gi
        requests:
          memory: 512Mi

resources:
  - ./resources/authentik.yaml
  - ./resources/dns.yaml
  - ./resources/ingress.yaml
  - ./resources/namespace.yaml
  - ./resources/volume.yaml
