apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: grafana-alloy

helmCharts:
  - name: alloy
    releaseName: alloy
    namespace: grafana-alloy
    version: 1.11.1
    repo: https://grafana.github.io/helm-charts
    includeCRDs: true
    valuesInline:
      alloy:
        configMap:
          name: config
          create: false
          key: config.alloy
        mounts:
          # loki.source.journal は /etc/machine-id を読んで自分のマシンの
          # ジャーナルディレクトリ (/var/log/journal/<machine-id>/) を特定する。
          # コンテナ内の /etc/machine-id は空のため、ホストのものをマウントしないと
          # 対象が見つからず、エラーも出ないまま 1 行も読めない。
          extra:
            - name: etc-machine-id
              mountPath: /etc/machine-id
              readOnly: true
          varlog: true
      controller:
        volumes:
          extra:
            - name: etc-machine-id
              hostPath:
                path: /etc/machine-id
                type: File

resources:
  - ./resources/dns.yaml
  - ./resources/ingress.yaml
configMapGenerator:
  - name: config
    files:
      - ./config/config.alloy
    options:
      disableNameSuffixHash: true
