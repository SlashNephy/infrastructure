name: TMP Verify App Token

on:
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23liKChiFOA2aFE8Wa # slashnephy-infrastructure
          private-key: ${{ secrets.DISPATCH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Show granted permissions
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh api /installation/repositories --jq '.repositories[].full_name'

      - name: Create branch and pull request
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          base_sha=$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/master --jq .object.sha)
          branch="ci/app-token-check-${GITHUB_RUN_ID}"

          tree=$(gh api repos/${GITHUB_REPOSITORY}/git/commits/"$base_sha" --jq .tree.sha)
          commit=$(gh api repos/${GITHUB_REPOSITORY}/git/commits -f message="chore: verify app token permissions" -f tree="$tree" -f parents[]="$base_sha" --jq .sha)
          gh api repos/${GITHUB_REPOSITORY}/git/refs -f ref="refs/heads/$branch" -f sha="$commit" --jq .ref

          number=$(gh pr create --base master --head "$branch" --title "chore: verify app token permissions" --body "App トークンの権限確認用。すぐ閉じます。" | grep -oE '[0-9]+$')
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Close pull request
        if: always() && steps.pr.outputs.number
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: gh pr close "$PR_NUMBER" --delete-branch --comment "権限確認が完了したため閉じます。"
