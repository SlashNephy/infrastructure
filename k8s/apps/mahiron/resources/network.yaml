apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: app

spec:
  endpointSelector:
    matchLabels:
      app: default
  ingress:
    # traefik・kotatsu・konomitv など
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "40772"
              protocol: TCP
    - fromCIDRSet:
        - cidr: 192.168.1.0/24
      toPorts:
        - ports:
            - port: "40772"
              protocol: TCP
