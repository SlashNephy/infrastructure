# PostgreSQL のデータを置くホストのディレクトリ。インスタンスごとに 1 つ用意する (database.yaml)。
# Cluster の pvcTemplate は、ラベルの name: kotatsu-db-data で PV を選ぶ。
apiVersion: v1
kind: PersistentVolume
metadata:
  labels:
    name: kotatsu-db-data
  name: kotatsu-db-data

spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 8Gi
  local:
    path: /mnt/local/kotatsu/db
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - lily
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local
---
apiVersion: v1
kind: PersistentVolume
metadata:
  labels:
    name: kotatsu-db-data
  name: kotatsu-db-data-2

spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 8Gi
  local:
    path: /mnt/local/kotatsu/db-2
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - lily
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local
