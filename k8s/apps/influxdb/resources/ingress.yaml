apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: route

spec:
  routes:
    # bot のクロールを抑止するため robots.txt を返す。
    - kind: Rule
      match: Host(`influxdb.starry.blue`) && Path(`/robots.txt`)
      priority: 100
      services:
        - name: robots-txt
          namespace: traefik
          port: http

    - kind: Rule
      match: Host(`influxdb.starry.blue`)
      priority: 10
      services:
        - name: influxdb
          port: http
      middlewares:
        - name: forward-auth-authentik
          namespace: authentik

    - kind: Rule
      match: Host(`influxdb.starry.blue`) && PathPrefix(`/outpost.goauthentik.io/`)
      priority: 15
      services:
        - name: authentik-server
          namespace: authentik
          port: http

    # 外形監視のため /ping のみ認証を迂回させる。
    # 版数を返す /health ではなく、本文が空の /ping を選ぶ。
    - kind: Rule
      match: Host(`influxdb.starry.blue`) && Path(`/ping`)
      priority: 20
      services:
        - name: influxdb
          port: http
