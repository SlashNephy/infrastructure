# PostgreSQL のデータを置くホストのディレクトリ。
apiVersion: v1
kind: PersistentVolume
metadata:
  name: kotatsu-db-data
  labels:
    name: kotatsu-db-data

spec:
  storageClassName: local
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 8Gi
  local:
    path: /mnt/local/kotatsu/db
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - lily
  persistentVolumeReclaimPolicy: Retain
