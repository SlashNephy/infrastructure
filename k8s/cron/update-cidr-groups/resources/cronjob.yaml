# Traefik の ingress の許可リストに使う CiliumCIDRGroup を取得元の最新の一覧に更新する。
# 一方の取得が壊れてももう一方は更新できるよう、グループごとにコンテナを分けている
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cronjob

spec:
  schedule: "41 4 * * *"
  timeZone: Asia/Tokyo
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          containers:
            - name: jp-ipv6
              image: alpine/kubectl:1.37.0@sha256:954b65dea0eb140219b440413ede17c2eca205866df350d3c1fbc84d28af14ae
              command:
                - /bin/ash
                - /scripts/update.sh
                - jp-ipv6
              env:
                # kubectl がキャッシュを書き込めるようにする
                - name: HOME
                  value: /tmp
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                limits:
                  memory: 128Mi
                requests:
                  cpu: 10m
                  memory: 32Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
            - name: cloudflare
              image: alpine/kubectl:1.37.0@sha256:954b65dea0eb140219b440413ede17c2eca205866df350d3c1fbc84d28af14ae
              command:
                - /bin/ash
                - /scripts/update.sh
                - cloudflare
              env:
                # kubectl がキャッシュを書き込めるようにする
                - name: HOME
                  value: /tmp
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                limits:
                  memory: 128Mi
                requests:
                  cpu: 10m
                  memory: 32Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
          volumes:
            - name: scripts
              configMap:
                name: scripts
            - name: tmp
              emptyDir: {}
          restartPolicy: Never
          securityContext:
            runAsGroup: 65534
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          serviceAccountName: service-account
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 1
  successfulJobsHistoryLimit: 1
