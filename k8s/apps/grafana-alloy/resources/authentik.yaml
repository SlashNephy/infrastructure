apiVersion: authentik.starry.blue/v1alpha1
kind: AuthentikApplication
metadata:
  name: grafana-alloy

spec:
  access:
    rules:
      - group:
          name: Admin
  adopt: IfMatch
  group: Observability
  icon: https://github.com/grafana.png
  name: Grafana Alloy
  provider:
    name: Grafana Alloy
    flows:
      authorization:
        slug: authorize
      invalidation:
        slug: default-provider-invalidation-flow
    proxy:
      accessTokenValidity: days=1
      forwardAuthSingle:
        externalHost: https://grafana-alloy.starry.blue
      interceptHeaderAuth: true
      outpost:
        name: authentik Embedded Outpost
      refreshTokenValidity: days=30
  slug: grafana-alloy
