apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: n8n

images:
  # チャートの更新が遅いのでセルフアップデート
  - name: n8nio/n8n
    newTag: 2.33.3@sha256:769d3a624534ff8b5f3316ef71d4653f48794c47e4339436be7a308d6d6a1cc9
  # Bitnami は 2025-08 にバージョン固定タグを有償枠へ移し、public.ecr.aws のミラーも 2026-06 に削除した。
  # 無償でバージョンを固定できるのは凍結済みの bitnamilegacy だけなので、そこに固定する。
  - name: docker.io/bitnami/postgresql
    newName: docker.io/bitnamilegacy/postgresql
    newTag: 17.6.0-debian-12-r4@sha256:926356130b77d5742d8ce605b258d35db9b62f2f8fd1601f9dbaef0c8a710a8d

helmCharts:
  # https://github.com/8gears/n8n-helm-chart
  - name: n8n
    releaseName: n8n
    namespace: n8n
    version: 2.0.1
    repo: oci://8gears.container-registry.com/library
    includeCRDs: true
    valuesInline:
      main:
        config:
          db:
            postgresdb:
              database: n8n
              host: postgresql
              user: n8n
            type: postgresdb
          generic:
            timezone: Asia/Tokyo
          n8n:
            diagnostics_enabled: "false"
            host: n8n.starry.blue
            protocol: https
            proxy_hops: "1"
            version_notifications_enabled: "false"
        extraEnv:
          DB_POSTGRESDB_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: postgresql-secret
                key: password
          N8N_ENCRYPTION_KEY:
            valueFrom:
              secretKeyRef:
                name: n8n-secret
                key: encryption_key
          N8N_LICENSE_ACTIVATION_KEY:
            valueFrom:
              secretKeyRef:
                name: n8n-secret
                key: license_activation_key
        # チャート既定は liveness / readiness とも /healthz を向いているが、これはプロセスの生存しか
        # 見ないため、DB 接続が切れて n8n が自力で復帰できなくなっても Pod は Ready のまま放置される。
        # 実際 2026-08-08 に PostgreSQL の再起動をきっかけに n8n の再接続機構が発火せず、
        # /rest/login が 503 Database is not ready! を返し続けた。
        # DB 接続まで見る /healthz/readiness を向けて、Kubernetes 側から検知・自己修復できるようにする。
        livenessProbe:
          # PostgreSQL の再起動やメンテナンスで一時的に落ちただけで再起動ループに入らないよう、
          # 5 分 (10s × 30) の猶予を持たせる。チャート既定の failureThreshold と同値。
          failureThreshold: 30
          httpGet:
            path: /healthz/readiness
            port: http
          periodSeconds: 10
        persistence:
          enabled: true
          existingClaim: n8n-data
          type: existing
        readinessProbe:
          # 疎通不能なうちにリクエストを流し込まないよう、readiness は liveness より早く落とす。
          failureThreshold: 3
          httpGet:
            path: /healthz/readiness
            port: http
          periodSeconds: 10
      # TODO: worker を分離
      # worker:
      #   enabled: true
      #   replicaCount: 1
      # valkey:
      #   enabled: true
      #   auth:
      #     enabled: false
  - name: postgresql
    releaseName: postgresql
    version: 18.8.6
    repo: oci://registry-1.docker.io/bitnamicharts
    valuesInline:
      auth:
        database: n8n
        existingSecret: postgresql-secret
        username: n8n
      backup:
        cronjob:
          concurrencyPolicy: Forbid
          containerSecurityContext:
            runAsGroup: 1000
            runAsUser: 1000
          restartPolicy: Never
          # @hourly
          schedule: "20 * * * *"
          storage:
            existingClaim: n8n-postgresql-backup
          timeZone: Asia/Tokyo
        enabled: true
      image:
        # チャート 18.x の既定は registry-1.docker.io だが、それだと上の images による
        # 差し替えが名前一致せず無言で素通りするので docker.io に戻す
        registry: docker.io
      primary:
        extraEnvVars:
          - name: TZ
            value: Asia/Tokyo
        # Bitnami の PostgreSQL イメージは STOPSIGNAL を設定しておらず、PID 1 の postgres は
        # SIGTERM を smart shutdown (既存クライアントが自ら切断するまで待つ) と解釈する。
        # n8n はコネクションプールを保持し続けるので待機が終わらず、
        # terminationGracePeriodSeconds 満了で SIGKILL され、毎回クラッシュリカバリになる。
        # 公式 postgres イメージは STOPSIGNAL SIGINT でこれを回避しているが、
        # Kubernetes 1.35 時点で stopSignal は ContainerStopSignals が alpha かつ無効のため使えない。
        # そこで preStop で明示的に fast shutdown する。
        lifecycleHooks:
          preStop:
            exec:
              command:
                - /bin/sh
                - -c
                # terminationGracePeriodSeconds (既定 30 秒) を超えないよう -t で頭打ちにする
                - pg_ctl stop -D "$PGDATA" -m fast -w -t 25
        persistence:
          existingClaim: n8n-postgresql-data
        resourcesPreset: nano

resources:
  - ./resources/cronjob-cleanup-backup.yaml
  - ./resources/dns.yaml
  - ./resources/ingress.yaml
  - ./resources/secret.yaml
  - ./resources/service-lm-studio.yaml
  - ./resources/volume-backup.yaml
  - ./resources/volume-data.yaml
  - ./resources/volume-postgresql.yaml
