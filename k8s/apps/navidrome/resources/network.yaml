# NodePort で LAN の端末から直接使う。それ以外からの ingress は受け付けない。
# kube-proxy replacement の単一ノードでは NodePort 経由でも送信元 IP が保たれるため、
# fromCIDR で LAN の端末に絞れる
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: app

spec:
  endpointSelector:
    matchLabels:
      app: default
  ingress:
    # kubelet の probe
    - fromEntities:
        - host
    - fromCIDRSet:
        - cidr: 192.168.1.0/24
      toPorts:
        - ports:
            - port: "4533"
              protocol: TCP
