apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argo-cd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd

data:
  # ログインは authentik の SSO に限る
  admin.enabled: "false"
  dex.config: |
    connectors:
      - id: authentik
        name: Authentik
        type: oidc
        config:
          issuer: https://id.starry.blue/application/o/argo-cd/
          clientID: $dex.authentik.clientID
          clientSecret: $dex.authentik.clientSecret
          insecureEnableGroups: true
          scopes:
            - openid
            - profile
            - email

  exec.enabled: "true"
  exec.shells: zsh,bash,ash,sh

  helm.enabled: "true"
  kustomize.buildOptions: --enable-helm --load-restrictor LoadRestrictionsNone
  kustomize.enabled: "true"

  # TODO: Annotation で ignoreDifferences を管理できるようになったら移行したい
  # https://github.com/argoproj/argo-cd/issues/12686
  resource.customizations.ignoreDifferences.Service: |
    jsonPointers:
      - /spec/externalName
  resource.customizations.ignoreDifferences.apps_Deployment: |
    jqPathExpressions:
      - '.spec.template.spec.containers[]?.securityContext.sysctls'
  # 中身は cron-update-cidr-groups が取得元の最新の一覧に書き換える。git の一覧は初回作成時の種でしかない
  resource.customizations.ignoreDifferences.cilium.io_CiliumCIDRGroup: |
    jsonPointers:
      - /spec/externalCIDRs

  statusbadge.enabled: "true"

  # Webhook のトリガーのみを使用する
  # https://argo-cd.readthedocs.io/en/latest/faq/#how-often-does-argo-cd-check-for-changes-to-my-git-or-helm-repository
  timeout.reconciliation: "0"
  url: https://argocd.starry.blue
