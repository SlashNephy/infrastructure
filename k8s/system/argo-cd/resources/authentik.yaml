apiVersion: authentik.starry.blue/v1alpha1
kind: AuthentikApplication
metadata:
  name: argo-cd

spec:
  access:
    rules:
      - group:
          name: ArgoCD/Admin
      - group:
          name: ArgoCD/Viewer
  adopt: IfMatch
  group: System
  icon: https://github.com/argoproj.png
  launchURL: https://argocd.starry.blue/auth/login
  name: Argo CD
  provider:
    name: Argo CD
    flows:
      authentication:
        slug: sign-in
      authorization:
        slug: authorize
      invalidation:
        slug: default-provider-invalidation-flow
    oauth2:
      accessCodeValidity: minutes=1
      accessTokenValidity: hours=1
      clientType: Confidential
      # argocd-secret を client ID / client secret の source of truth とする。
      # argocd-server も argocd-cm の $dex.authentik.* 経由で同じ Secret を読むため、
      # ローテーションは 1Password の item を更新するだけで両側に行き渡る。
      credentials:
        secretRef:
          name: argocd-secret
          clientIDKey: dex.authentik.clientID
          clientSecretKey: dex.authentik.clientSecret
      grantTypes:
        - AuthorizationCode
        - RefreshToken
      includeClaimsInIDToken: true
      issuerMode: PerProvider
      logoutMethod: BackChannel
      redirectURIs:
        - matchingMode: Strict
          type: Authorization
          url: https://argocd.starry.blue/auth/callback
      refreshTokenThreshold: seconds=0
      refreshTokenValidity: days=30
      scopes:
        - scopeName: openid
        - scopeName: email
        # Argo CD がセッションを延長するためのリフレッシュトークンは offline_access でのみ発行される
        - scopeName: offline_access
        - scopeName: profile
      signingKey:
        name: id.starry.blue
      subjectMode: HashedUserID
  slug: argo-cd

---
# Argo CD 自体のログイン (OIDC) とは別に、手前の forward auth 用の Application を置く。
# Proxy provider は redirect URI や署名鍵を authentik が固定値で上書きするため、
# Argo CD の OIDC クライアントを兼ねられない。
apiVersion: authentik.starry.blue/v1alpha1
kind: AuthentikApplication
metadata:
  name: argo-cd-forward-auth

spec:
  # Argo CD の OIDC Application と同じグループに限る。
  access:
    rules:
      - group:
          name: ArgoCD/Admin
      - group:
          name: ArgoCD/Viewer
  hideFromApplicationDashboard: true
  name: argocd.starry.blue
  provider:
    name: argocd.starry.blue
    flows:
      authorization:
        slug: authorize
      invalidation:
        slug: default-provider-invalidation-flow
    proxy:
      accessTokenValidity: days=1
      forwardAuthSingle:
        externalHost: https://argocd.starry.blue
      interceptHeaderAuth: true
      outpost:
        name: authentik Embedded Outpost
      refreshTokenValidity: days=30
  slug: argo-cd-forward-auth
