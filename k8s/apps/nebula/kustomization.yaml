apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nebula

images:
  - name: docker.io/bitnami/postgresql
    newName: ghcr.io/slashnephy/nebula-postgres
    newTag: main@sha256:78c1b5db2ae488459ee3b22f25894bc094ae8d791421fb89bc4c884bf281ed40
  - name: docker.io/bitnami/os-shell
    newName: docker.io/bitnamilegacy/os-shell
    # チャート 18.x の既定タグは latest で、bitnamilegacy の latest は 2025-07 時点の
    # 古いイメージになるため、これまでレンダリングされていたタグを明示する
    newTag: 12-debian-12-r51@sha256:77e65e9d633ec1463f8bea185763aa7ef91e5ddbe0b60beb1b0b5d4da58882b6
  - name: docker.io/bitnami/redis
    newName: docker.io/bitnamilegacy/redis
    # チャート既定タグは latest で、bitnamilegacy の latest は 2025-07 時点の古いイメージに
    # なるため明示する。bitnamilegacy は凍結済みで稼働中の 8.2.2 を収録しておらず 8.2.1 が最新だが、
    # 8.2.2 が書いた Multi-Part AOF を 8.2.1 が読めることは検証済み。
    newTag: 8.2.1-debian-12-r0@sha256:25bf63f3caf75af4628c0dfcf39859ad1ac8abe135be85e99699f9637b16dc28

helmCharts:
  - name: postgresql
    releaseName: postgresql
    version: 18.8.4
    repo: oci://registry-1.docker.io/bitnamicharts
    valuesInline:
      auth:
        database: nebula
        existingSecret: postgresql-secret
        username: nebula
      global:
        imagePullSecrets:
          - ghcr-io-credentials
      image:
        # チャート 18.x の既定は registry-1.docker.io だが、それだと上の images による
        # 差し替えが名前一致せず無言で素通りするので docker.io に戻す
        registry: docker.io
      primary:
        extraEnvVars:
          - name: TZ
            value: Asia/Tokyo
        extraVolumeMounts:
          - name: var-run
            mountPath: /var/run/postgresql
        extraVolumes:
          - name: var-run
            emptyDir: {}
        persistence:
          existingClaim: nebula-postgresql-data
        resourcesPreset: xlarge
        service:
          nodePorts:
            postgresql: 5432
          type: NodePort
      tls:
        autoGenerated: true
        enabled: true
      volumePermissions:
        image:
          # 証明書をコピーする init container が使う os-shell も同様に docker.io へ戻す
          registry: docker.io
  - name: redis
    releaseName: redis
    version: 27.0.18
    repo: oci://registry-1.docker.io/bitnamicharts
    valuesInline:
      architecture: standalone
      auth:
        existingSecret: redis-secret
      image:
        # チャートの既定は registry-1.docker.io だが、それだと上の images による
        # 差し替えが名前一致せず無言で素通りするので docker.io に戻す
        registry: docker.io
      master:
        extraEnvVars:
          - name: TZ
            value: Asia/Tokyo
        persistence:
          existingClaim: nebula-redis-data
        resourcesPreset: nano

resources:
  - ./../../common/registry-ghcr-io/lily
  - ./resources/cronjob-backup-contents.yaml
  - ./resources/cronjob-backup-database.yaml
  - ./resources/deployment-backend.yaml
  - ./resources/deployment-ffmpeg.yaml
  - ./resources/deployment-frontend.yaml
  - ./resources/deployment-instagram.yaml
  - ./resources/deployment-ml.yaml
  - ./resources/deployment-river-ui.yaml
  - ./resources/deployment-worker.yaml
  - ./resources/deployment-xctid.yaml
  - ./resources/deployment-ytdlp.yaml
  - ./resources/dns.yaml
  - ./resources/ingress.yaml
  - ./resources/namespace.yaml
  - ./resources/secret.yaml
  - ./resources/service.yaml
  - ./resources/volume-postgresql.yaml
  - ./resources/volume-redis.yaml

configMapGenerator:
  - name: backend-config
    literals:
      - MODE=production
      - SERVER_ORIGIN=https://nebula.starry.blue
      - FRONTEND_ORIGIN=https://nebula.starry.blue
      - COOKIE_DOMAIN=nebula.starry.blue
      - MEDIA_STORAGE_LOCAL_DIRECTORY=/app/media
      - AVATAR_STORAGE_LOCAL_DIRECTORY=/app/avatars
      - THUMBNAIL_STORAGE_LOCAL_DIRECTORY=/app/thumbnails
      - ML_BASE_URL=http://ml:8083
      - XCTID_BASE_URL=http://xctid:8084
      - INSTAGRAM_BASE_URL=http://instagram:8085
      - YTDLP_BASE_URL=http://ytdlp:8086
      - FFMPEG_BASE_URL=http://ffmpeg:8087
      # DEBUG では SQL クエリの全文が出力され、クラスタ全体のログ量の 58% を占めていた
      - LOG_LEVEL=info
