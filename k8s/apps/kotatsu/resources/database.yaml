# Kotatsu の PostgreSQL。HA は目指さない (lily は単一ノードで PV も local のため)。
# 接続先は、CloudNativePG が作る Secret kotatsu-db-app の uri を使う。
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: kotatsu-db

spec:
  bootstrap:
    initdb:
      database: kotatsu
      encoding: UTF8
      owner: kotatsu
  # 拡張を使わず、照合順序も C なので、拡張やロケールを含まない minimal にする。
  # タグは PostgreSQL の版、ビルドの日時、種類、OS の順で、Renovate が版とビルドの両方を追う (renovate.json5)。
  imageName: ghcr.io/cloudnative-pg/postgresql:19.0-202611201710-minimal-trixie@sha256:28f6604b4e142cadd8b0154ae82a5541e321d6f33b27fc5a054ced3dde53e6e8
  # mackerel-container-agent を注入する (mackerel-agent.yaml)。CNPG は、この metadata を Pod のほか Service や PVC にも付ける。
  # 注入は Pod を作るときだけなので、変えた後は Pod を作り直す。ServiceAccount (kotatsu-db) の権限は mackerel-agent.yaml で付けている。
  inheritedMetadata:
    annotations:
      agent.mackerel.starry.blue/apikey-secret-name: mackerel-agent-api-key
      agent.mackerel.starry.blue/roles: kotatsu:db
    labels:
      agent.mackerel.starry.blue/inject: "true"
  instances: 1
  postgresql:
    parameters:
      log_timezone: Asia/Tokyo
      timezone: Asia/Tokyo
  # 7 日の実測で、メモリはピークでも 787MiB (ページキャッシュを含む) なので、limits を絞る。
  resources:
    limits:
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 512Mi
  storage:
    pvcTemplate:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 8Gi
      selector:
        matchLabels:
          name: kotatsu-db-data
      storageClassName: local
