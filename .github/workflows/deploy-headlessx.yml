name: Deploy headlessx

on:
  push:
    paths:
      - .github/workflows/deploy-headlessx.yml
  workflow_dispatch:

permissions: {}

jobs:
  build-api:
    # 無限ループすることがある
    if: github.actor != 'slashnephy-infrastructure[bot]'
    uses: SlashNephy/actions/.github/workflows/build-docker-image.yml@d5bbbb58e94f3b25497f996ea141b31d6db26857 # v1.0.1
    permissions:
      contents: read
      packages: write
      actions: read
      security-events: write
    with:
      repository: SaifyXPRO/HeadlessX
      # renovate: datasource=github-tags depName=SaifyXPRO/HeadlessX
      ref: v2.1.2
      image-name: ghcr.io/slashnephy/headlessx-api
      dockerfile: infra/docker/api.Dockerfile
      image-platforms: linux/amd64
      dispatch-update-image-digest: true
    secrets:
      dispatch-app-private-key: ${{ secrets.DISPATCH_APP_PRIVATE_KEY }}

  build-web:
    # 無限ループすることがある
    if: github.actor != 'slashnephy-infrastructure[bot]'
    uses: SlashNephy/actions/.github/workflows/build-docker-image.yml@d5bbbb58e94f3b25497f996ea141b31d6db26857 # v1.0.1
    permissions:
      contents: read
      packages: write
      actions: read
      security-events: write
    with:
      repository: SaifyXPRO/HeadlessX
      # renovate: datasource=github-tags depName=SaifyXPRO/HeadlessX
      ref: v2.1.2
      image-name: ghcr.io/slashnephy/headlessx-web
      dockerfile: infra/docker/web.Dockerfile
      image-platforms: linux/amd64
      dispatch-update-image-digest: true
    secrets:
      dispatch-app-private-key: ${{ secrets.DISPATCH_APP_PRIVATE_KEY }}
