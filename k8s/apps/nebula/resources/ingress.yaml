apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: route

spec:
  routes:
    - kind: Rule
      match: Host(`nebula.starry.blue`)
      priority: 10
      services:
        - name: frontend
          port: http
      middlewares:
        - name: forward-auth-authentik
          namespace: authentik

    - kind: Rule
      match: Host(`nebula.starry.blue`) && PathPrefix(`/outpost.goauthentik.io/`)
      priority: 15
      services:
        - name: authentik-server
          namespace: authentik
          port: http

    # このルールに middleware を付けないのは意図的で、アプリケーション側で自前の
    # 認証・認可を行う経路をまとめている。/mcp はブラウザ以外のクライアントが
    # Bearer トークンで叩く API であり、対話的なログインを前提とする forward-auth を
    # 通すと SSO へリダイレクトされて到達できなくなる。
    #
    # /mcp を PathPrefix にすると frontend の別のパスまで巻き込むため、完全一致と
    # 配下だけを対象にする。Traefik の PathPrefix がセグメント境界を見るかどうかに
    # 依存しない書き方でもある。
    - kind: Rule
      match: Host(`nebula.starry.blue`) && (PathPrefix(`/api`) || PathPrefix(`/oauth`) || PathPrefix(`/.well-known`) || Path(`/mcp`) || PathPrefix(`/mcp/`)) && !Path(`/oauth/authorize`)
      priority: 20
      services:
        - name: backend
          port: http

    - kind: Rule
      match: Host(`nebula-river.starry.blue`)
      priority: 10
      services:
        - name: river-ui
          port: http
      middlewares:
        - name: forward-auth-authentik
          namespace: authentik

    - kind: Rule
      match: Host(`nebula-river.starry.blue`) && PathPrefix(`/outpost.goauthentik.io/`)
      priority: 15
      services:
        - name: authentik-server
          namespace: authentik
          port: http

  tls:
    options:
      name: gateway
      namespace: traefik
