apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: dns

spec:
  endpoints:
    - dnsName: konomitv.starry.blue
      providerSpecific:
        - name: external-dns.kubernetes.io/cloudflare-proxied
          value: "true"
      recordTTL: 1 # Auto
      recordType: CNAME
      targets:
        - gateway.starry.blue

---
apiVersion: mackerel.starry.blue/v1alpha1
kind: ExternalMonitor
metadata:
  name: https

spec:
  certificationExpirationCritical: 7
  certificationExpirationWarning: 14
  expectedStatusCode: 200
  method: GET
  responseTimeCritical: 5000
  responseTimeDuration: 1
  responseTimeWarning: 3000
  service: Production
  url: https://konomitv.starry.blue/api/version
