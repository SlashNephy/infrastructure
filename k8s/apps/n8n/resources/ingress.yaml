apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: route

spec:
  routes:
    # bot のクロールを抑止するため robots.txt を返す。
    - kind: Rule
      match: Host(`n8n.starry.blue`) && Path(`/robots.txt`)
      priority: 100
      services:
        - name: robots-txt
          namespace: traefik
          port: http

    - kind: Rule
      match: Host(`n8n.starry.blue`)
      priority: 10
      services:
        - name: n8n-main
          port: http
      middlewares:
        - name: forward-auth-authentik
          namespace: authentik

    - kind: Rule
      match: Host(`n8n.starry.blue`) && PathPrefix(`/outpost.goauthentik.io/`)
      priority: 15
      services:
        - name: authentik-server
          namespace: authentik
          port: http

    # 外部サービスから呼ばれる本番の Webhook と、外形監視の /healthz は認証を迂回させる。
    # Webhook の認証は各ワークフローの Webhook ノードで行う。
    - kind: Rule
      match: Host(`n8n.starry.blue`) && (PathPrefix(`/webhook/`) || Path(`/healthz`))
      priority: 20
      services:
        - name: n8n-main
          port: http

    # MCP サーバー。クライアントはブラウザを持たずに呼ぶので forward-auth を通さない。
    # 認証は n8n が Bearer トークンで行い、トークンが無ければ 401 を返す。
    # /mcp-oauth/register は誰でもクライアントを登録できるため、OAuth の端点は公開せず forward-auth の内側に置く。
    - kind: Rule
      match: Host(`n8n.starry.blue`) && Path(`/mcp-server/http`)
      priority: 20
      services:
        - name: n8n-main
          port: http
