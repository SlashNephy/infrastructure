apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-contents

spec:
  schedule: "15 * * * *"
  timeZone: Asia/Tokyo
  jobTemplate:
    spec:
      backoffLimit: 0
      # 暴走時の打ち切り。通常でも 86 分かかる（2026-08-14 実測 5155 秒）ため、
      # 正常な同期を殺さないよう通常値の約 2 倍に置く。
      # concurrencyPolicy: Forbid があるので多重起動はしないが、上限がないと
      # 1 本が走り続けてノードの I/O を占有し続ける
      activeDeadlineSeconds: 10800
      template:
        spec:
          containers:
            - name: media
              image: rclone/rclone:1.75.0@sha256:b06aed988cf5967de7c25be5925240983981c757f4ed1ac9d2fa659d51d60548
              args:
                - sync
                - /mnt/local/nebula/media
                - google_drive:Backup/nebula/media
                - --config=/mnt/local/nebula/rclone/rclone.conf
              volumeMounts:
                - name: media
                  mountPath: /mnt/local/nebula/media
                  readOnly: true
                - name: rclone
                  mountPath: /mnt/local/nebula/rclone
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
                runAsGroup: 1000
                runAsUser: 1000
            - name: avatars
              image: rclone/rclone:1.75.0@sha256:b06aed988cf5967de7c25be5925240983981c757f4ed1ac9d2fa659d51d60548
              args:
                - sync
                - /mnt/local/nebula/avatars
                - google_drive:Backup/nebula/avatars
                - --config=/mnt/local/nebula/rclone/rclone.conf
              volumeMounts:
                - name: avatars
                  mountPath: /mnt/local/nebula/avatars
                  readOnly: true
                - name: rclone
                  mountPath: /mnt/local/nebula/rclone
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
                runAsGroup: 1000
                runAsUser: 1000
          volumes:
            - name: media
              hostPath:
                path: /mnt/local/nebula/media
                type: Directory
            - name: avatars
              hostPath:
                path: /mnt/local/nebula/avatars
                type: Directory
            - name: rclone
              hostPath:
                path: /mnt/local/nebula/rclone
                type: Directory
          restartPolicy: Never
          securityContext:
            seccompProfile:
              type: RuntimeDefault
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
