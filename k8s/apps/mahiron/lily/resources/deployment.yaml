apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment

spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: default
  template:
    metadata:
      labels:
        app: default
    spec:
      containers:
        - name: app
          image: ghcr.io/starrybluesky/mahiron5-custom:master@sha256:336f771a77210ec607ba9da09d9682945747720b6f6437e9d43592ff6ef310b3
          # イメージ既定の設定ディレクトリは /app/config のため、明示的に上書きする
          args:
            - -config-dir
            - /etc/mahiron
          env:
            - name: TZ
              value: Asia/Tokyo
          ports:
            - containerPort: 40772
          volumeMounts:
            - name: data
              mountPath: /var/db/mahiron
            - name: config
              mountPath: /etc/mahiron
              readOnly: true
          # requests を指定せず BestEffort になっていると、cgroup v2 の
          # kubepods-besteffort.slice は cpu.weight=1 で kubepods-burstable.slice (197) に
          # 200:1 で劣後する。recpt1 は USB のリングバッファを一定間隔で読み出す必要があるため、
          # ノードが混んでいる間だけランキュー待ちが伸びてドロップが増えていた。
          # Burstable に上げて CPU の取り分を確保する。
          # CFS スロットリングによる 100ms 単位の停止はドロップに直結するため CPU の limits は付けない。
          #
          # チューナーは generic-device-plugin の拡張リソースとして割り当てる (拡張リソースは limits に書く)。
          # privileged だとホストの /dev が丸ごと見えるため外す
          #
          # メモリの requests は working set の日次最大の中央値から決めた。
          # 2026-09-21 以降 (Go 製の mahiron) は中央値が約 150Mi、最大が約 530Mi。
          # limits は付けないので、一時的に requests を超えても止まらない
          resources:
            limits:
              devic.es/pxtuners: 1
            requests:
              cpu: "2"
              memory: 256Mi
          securityContext:
            capabilities:
              add:
                - SYS_ADMIN
                - SYS_NICE
      volumes:
        # 4 系の /mnt/local/mahiron/ は切り戻しの土台として残し、5 系は別ディレクトリを使う
        - name: data
          hostPath:
            path: /mnt/local/mahiron5/data
            type: DirectoryOrCreate
        - name: config
          hostPath:
            path: /mnt/local/mahiron5/config
            type: Directory
      restartPolicy: Always
      imagePullSecrets:
        - name: ghcr-io-credentials
      priorityClassName: recording
      # イメージは UID/GID 10001 の非 root ユーザーで動く。
      # hostPath には fsGroup が効かないため、ホストの /mnt/local/mahiron5 の所有者は手で 10001:10001 に揃えてある。
      # チューナーのデバイス (/dev/px4video*) はホストで root:video (985) の 0664 なので、video グループを足して書き込めるようにする
      securityContext:
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
        supplementalGroups:
          - 985
      # Mahiron は tuner を `sh -c "recpt1 ..."` で起動するが、この sh は exec せず fork するため
      # recpt1 は孫プロセスになる。停止時に Wait されるのは直接の子である sh だけで、
      # 孤児になった recpt1 はコンテナ内 PID 1 (= mahiron 自身) に reparent されて reap されない。
      # PID namespace を共有して PID 1 を pause に譲り、pause に孤児を回収させる。
      shareProcessNamespace: true
