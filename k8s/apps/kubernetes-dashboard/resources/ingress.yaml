apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kubernetes-dashboard

spec:
  routes:
    # bot のクロールを抑止するため robots.txt を返す。
    - kind: Rule
      match: Host(`k8s.starry.blue`) && Path(`/robots.txt`)
      priority: 100
      services:
        - name: robots-txt
          namespace: traefik
          port: http

    - kind: Rule
      match: Host(`k8s.starry.blue`)
      priority: 10
      services:
        - name: kubernetes-dashboard-kong-proxy
          port: kong-proxy-tls
          scheme: https
          serversTransport: allow-insecure
      middlewares:
        - name: forward-auth-authentik
          namespace: authentik

    - kind: Rule
      match: Host(`k8s.starry.blue`) && PathPrefix(`/outpost.goauthentik.io/`)
      priority: 15
      services:
        - name: authentik-server
          namespace: authentik
          port: http

    # 外形監視のため kong の /healthz のみ認証を迂回させる。
    # 転送先が TLS を喋るため catch-all と同じ scheme と serversTransport が要る。
    - kind: Rule
      match: Host(`k8s.starry.blue`) && Path(`/healthz`)
      priority: 20
      services:
        - name: kubernetes-dashboard-kong-proxy
          port: kong-proxy-tls
          scheme: https
          serversTransport: allow-insecure

---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: allow-insecure

spec:
  insecureSkipVerify: true
