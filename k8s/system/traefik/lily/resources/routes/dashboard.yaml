apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: dashboard-route

spec:
  routes:
    # bot のクロールを抑止するため robots.txt を返す。
    - kind: Rule
      match: Host(`traefik.starry.blue`) && Path(`/robots.txt`)
      priority: 100
      services:
        - name: robots-txt
          namespace: traefik
          port: http

    - kind: Rule
      match: Host(`traefik.starry.blue`)
      priority: 10
      services:
        - name: api@internal
          kind: TraefikService
      middlewares:
        - name: auto-detect-content-type
        - name: forward-auth-authentik
          namespace: authentik

    - kind: Rule
      match: Host(`traefik.starry.blue`) && PathPrefix(`/outpost.goauthentik.io/`)
      priority: 15
      services:
        - name: authentik-server
          namespace: authentik
          port: http

    # 外形監視のため ping@internal を認証なしで公開する。
    # 動的ルートとして公開するため、entrypoint の既定 middleware が欠ける
    # などでルーターテーブルが読み込まれない場合はこのルート自体が消えて
    # 404 になる。プロセスが生きていれば常に 200 を返す traefik entrypoint
    # 上の静的な ping と違い、その障害を検知できる。
    - kind: Rule
      match: Host(`traefik.starry.blue`) && Path(`/ping`)
      priority: 20
      services:
        - name: ping@internal
          kind: TraefikService

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: auto-detect-content-type

spec:
  contentType: {}

---
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: dns-dashboard

spec:
  endpoints:
    - dnsName: traefik.starry.blue
      providerSpecific:
        - name: external-dns.alpha.kubernetes.io/cloudflare-proxied
          value: "true"
      recordTTL: 1 # Auto
      recordType: CNAME
      targets:
        - gateway.starry.blue

---
apiVersion: mackerel.starry.blue/v1alpha1
kind: ExternalMonitor
metadata:
  name: https

spec:
  certificationExpirationCritical: 7
  certificationExpirationWarning: 30
  expectedStatusCode: 200
  method: GET
  responseTimeCritical: 5000
  responseTimeDuration: 5
  responseTimeWarning: 3000
  service: Production
  url: https://traefik.starry.blue/ping
