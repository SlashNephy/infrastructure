apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: route

spec:
  routes:
    # bot のクロールを抑止するため robots.txt を返す。
    - kind: Rule
      match: Host(`n8n.starry.blue`) && Path(`/robots.txt`)
      priority: 100
      services:
        - name: robots-txt
          namespace: traefik
          port: http

    - kind: Rule
      match: Host(`n8n.starry.blue`)
      priority: 10
      services:
        - name: n8n-main
          port: http
      middlewares:
        - name: forward-auth-authentik
          namespace: authentik

    - kind: Rule
      match: Host(`n8n.starry.blue`) && PathPrefix(`/outpost.goauthentik.io/`)
      priority: 15
      services:
        - name: authentik-server
          namespace: authentik
          port: http

    # 外部サービスから呼ばれる本番の Webhook と、外形監視の /healthz は認証を迂回させる。
    # Webhook の認証は各ワークフローの Webhook ノードで行う。
    - kind: Rule
      match: Host(`n8n.starry.blue`) && (PathPrefix(`/webhook/`) || Path(`/healthz`))
      priority: 20
      services:
        - name: n8n-main
          port: http

    # MCP サーバーと、MCP のクライアントがトークンを得るための OAuth の端点。クライアントはブラウザを持たずに
    # 呼ぶので forward-auth を通さない。認証は n8n が Bearer トークンで行い、トークンが無ければ 401 を返す。
    # 同意の画面に送る /mcp-oauth/authorize は、ブラウザで開くので forward-auth を通す。
    - kind: Rule
      match: Host(`n8n.starry.blue`) && (Path(`/mcp-server/http`) || PathPrefix(`/.well-known/oauth-protected-resource`) || Path(`/.well-known/oauth-authorization-server`) || Path(`/mcp-oauth/register`) || Path(`/mcp-oauth/token`) || Path(`/mcp-oauth/revoke`))
      priority: 20
      services:
        - name: n8n-main
          port: http
