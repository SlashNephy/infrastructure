apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: route

spec:
  routes:
    # bot のクロールを抑止するため robots.txt を返す。
    - kind: Rule
      match: Host(`cilium.starry.blue`) && Path(`/robots.txt`)
      priority: 100
      services:
        - name: robots-txt
          namespace: traefik
          port: http

    - kind: Rule
      match: Host(`cilium.starry.blue`)
      priority: 10
      services:
        - name: hubble-ui
          port: http
      middlewares:
        - name: forward-auth-authentik
          namespace: authentik

    - kind: Rule
      match: Host(`cilium.starry.blue`) && PathPrefix(`/outpost.goauthentik.io/`)
      priority: 15
      services:
        - name: authentik-server
          namespace: authentik
          port: http

    # 外形監視のため /healthz のみ認証を迂回させる。
    # 従来は authentik の Unauthenticated Paths で開けていたが、
    # 設定を可視化するため IngressRoute 側の表現に移した。
    - kind: Rule
      match: Host(`cilium.starry.blue`) && Path(`/healthz`)
      priority: 20
      services:
        - name: hubble-ui
          port: http
