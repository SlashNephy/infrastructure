apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment

spec:
  replicas: 1
  # SQLite の DB を hostPath 上で単一ライターとして開くため、
  # 新旧 Pod が同時に存在すると "the database is locked" で新 Pod が起動できない
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: default
  template:
    metadata:
      labels:
        app: default
    spec:
      containers:
        - name: app
          image: gtstef/filebrowser:2.0.1-stable@sha256:2e3936caf7b12908f7d3ebb68ddfcea075cda5f732e4bd95beae6cfa529cbec7
          env:
            - name: TZ
              value: Asia/Tokyo
            - name: FILEBROWSER_CONFIG
              value: /config/config.yaml
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /config/config.yaml
              readOnly: true
              subPath: config.yaml
            - name: data
              mountPath: /data
            - name: public
              mountPath: /mnt/pool/public
              readOnly: true
            - name: music
              mountPath: /mnt/pool/music
            - name: dtv-records
              mountPath: /mnt/pool/records
              readOnly: true
            - name: dtv-records-local
              mountPath: /mnt/pool/records_local
              readOnly: true
            - name: dtv-konomitv-capture
              mountPath: /capture
            - name: tmp
              mountPath: /tmp
          # kubelet の httpGet はホストからの通信になり、network.yaml でホストを拒否しているため、Pod 内から確かめる
          livenessProbe:
            exec:
              command:
                - wget
                - -q
                - -O
                - /dev/null
                - -T
                - "4"
                - http://127.0.0.1:8080/health
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - wget
                - -q
                - -O
                - /dev/null
                - -T
                - "4"
                - http://127.0.0.1:8080/health
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsUser: 1000
          startupProbe:
            # 初回起動時は全ソースのインデックス作成が走るため、猶予を広く取る
            exec:
              command:
                - wget
                - -q
                - -O
                - /dev/null
                - -T
                - "4"
                - http://127.0.0.1:8080/health
            failureThreshold: 60
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: config
          configMap:
            name: app-config
        - name: data
          hostPath:
            path: /mnt/local/file-browser/data
            type: DirectoryOrCreate
        - name: public
          hostPath:
            path: /mnt/pool/public
            type: DirectoryOrCreate
        - name: music
          hostPath:
            path: /mnt/pool/music
            type: Directory
        - name: dtv-records
          hostPath:
            path: /mnt/pool/records
            type: Directory
        - name: dtv-records-local
          hostPath:
            path: /mnt/pool/records_local
            type: Directory
        - name: dtv-konomitv-capture
          hostPath:
            path: /mnt/local/konomitv/data/capture
            type: Directory
        - name: tmp
          emptyDir: {}
      restartPolicy: Always
      securityContext:
        seccompProfile:
          type: RuntimeDefault
