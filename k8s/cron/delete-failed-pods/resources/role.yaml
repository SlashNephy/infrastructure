apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cron-delete-failed-pods-cluster-role

rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - list
      - delete

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cron-delete-failed-pods-cluster-role-binding

roleRef:
  name: cron-delete-failed-pods-cluster-role
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
subjects:
  - name: service-account
    kind: ServiceAccount
