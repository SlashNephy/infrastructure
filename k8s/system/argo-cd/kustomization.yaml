apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argo-cd

helmCharts:
  # https://github.com/argoproj/argo-helm/tree/main/charts/argo-cd
  - name: argo-cd
    releaseName: argo-cd
    namespace: argo-cd
    version: 10.9.2
    repo: https://argoproj.github.io/argo-helm
    valuesInline:
      applicationSet:
        metrics:
          enabled: true
        # Telegraf は Pod Annotation による検出しかサポートしていない
        podAnnotations:
          prometheus.io/path: /metrics
          prometheus.io/port: "8080"

          prometheus.io/scheme: http
          prometheus.io/scrape: "true"
      controller:
        metrics:
          enabled: true
        # Telegraf は Pod Annotation による検出しかサポートしていない
        podAnnotations:
          prometheus.io/path: /metrics
          prometheus.io/port: "8082"
          prometheus.io/scheme: http
          prometheus.io/scrape: "true"
        # 他のすべての app を同期・自己修復する要であり、OOM で落ちると git からは直せないため limits は多めに取る
        resources:
          limits:
            memory: 2Gi
          requests:
            memory: 1Gi
      dex:
        initContainers:
          - name: wait-for-authentik
            args:
              - --url
              - https://id.starry.blue/application/o/argo-cd/
            image: ghcr.io/slashnephy/wait-for:master@sha256:ec3fd028bac9d381251ed2d39dbd5ae6692fa4774ce10d36a85699b5a0cc3270
        metrics:
          enabled: true
        # Telegraf は Pod Annotation による検出しかサポートしていない
        podAnnotations:
          prometheus.io/path: /metrics
          prometheus.io/port: "5558"
          prometheus.io/scheme: http
          prometheus.io/scrape: "true"
      global:
        addPrometheusAnnotations: true
      notifications:
        logFormat: json
        logLevel: warn
        metrics:
          enabled: true
        # Telegraf は Pod Annotation による検出しかサポートしていない
        podAnnotations:
          prometheus.io/path: /metrics
          prometheus.io/port: "9001"
          prometheus.io/scheme: http
          prometheus.io/scrape: "true"
      repoServer:
        livenessProbe:
          failureThreshold: 5
          initialDelaySeconds: 30
          timeoutSeconds: 5
        metrics:
          enabled: true
        # Telegraf は Pod Annotation による検出しかサポートしていない
        podAnnotations:
          prometheus.io/path: /metrics
          prometheus.io/port: "8084"
          prometheus.io/scheme: http
          prometheus.io/scrape: "true"
        replicas: 2
      server:
        extensions:
          enabled: true
        metrics:
          enabled: true
        # Telegraf は Pod Annotation による検出しかサポートしていない
        podAnnotations:
          prometheus.io/path: /metrics
          prometheus.io/port: "8083"
          prometheus.io/scheme: http
          prometheus.io/scrape: "true"
        service:
          nodePortHttp: 30000
          nodePortHttps: 30001
          type: NodePort
resources:
  - ./resources/application/lily.yaml
  - ./resources/application/nebula.yaml
  - ./resources/application/private.yaml
  - ./resources/authentik.yaml
  - ./resources/dns.yaml
  - ./resources/ingress.yaml
  - ./resources/namespace.yaml
  - ./resources/projects.yaml
  - ./resources/secret.yaml
  # - ./resources/secret-bbc.yaml
  # - ./resources/application/bbc.yaml
  # - ./resources/service-bbc.yaml

patches:
  # chart の NetworkPolicy は ingress を全許可 ([{}]) にしており、他のポリシーを足しても
  # 和集合で狭まらない。利用実態に合わせ、Traefik と LAN の端末 (NodePort) に絞る。
  # kubelet の probe は Cilium が host からの通信として常に許可する
  - target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: argo-cd-argocd-server
    patch: |-
      - op: replace
        path: /spec/ingress
        value:
          - from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: traefik
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: traefik
              # NodePort で直接使う。kube-proxy replacement の単一ノードでは
              # NodePort 経由でも送信元 IP が保たれる
              - ipBlock:
                  cidr: 192.168.1.0/24
            ports:
              - port: 8080
                protocol: TCP
  - path: ./resources/patch-argocd-cm.yaml
  - path: ./resources/patch-argocd-cmd-params-cm.yaml
  - path: ./resources/patch-argocd-notifications-cm.yaml
  - path: ./resources/patch-argocd-rbac-cm.yaml
  # enable exec
  - target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: Role
      name: argo-cd-argocd-server
    patch: |-
      - op: add
        path: /rules/-
        value:
          apiGroups:
            - ""
          resources:
            - pods/exec
          verbs:
            - create
  - target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: ClusterRole
      name: argo-cd-argocd-server
    patch: |-
      - op: add
        path: /rules/-
        value:
          apiGroups:
            - ""
          resources:
            - pods/exec
          verbs:
            - create
