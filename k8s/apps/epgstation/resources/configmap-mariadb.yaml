apiVersion: v1
kind: ConfigMap
metadata:
  name: mariadb

# Bitnami チャートが生成していた my.cnf と起動引数 (extraFlags) のうち、動作に関わるものを移す。
# 公式イメージの /etc/mysql/my.cnf は conf.d を最後に読むので、ここの値がイメージ既定より優先される。
data:
  epgstation.cnf: |
    [mariadbd]
    # Bitnami のイメージが使っていたデータディレクトリをそのまま使う
    datadir = /bitnami/mariadb/data
    bind-address = *
    skip-name-resolve
    explicit_defaults_for_timestamp
    max_allowed_packet = 16M
    character-set-server = utf8mb4
    collation-server = utf8mb4_unicode_520_ci
    expire_logs_days = 30
    slow_query_log = 1
    slow_query_log_file = /dev/stdout
    log_output = FILE
    long_query_time = 10
    # 既定の 128MB では program テーブル (data 107MB + index 5MB) だけで使い切ってしまい、
    # ルール検索の全件スキャンのたびに他のページを追い出して読み直していた。
    # ルールのキーワード検索は LIKE '%…%' なのでインデックスでは救えず、
    # キャッシュに載せる以外に打つ手が無い。コンテナの memory limit 3Gi の半分を割り当てる。
    innodb_buffer_pool_size = 1610612736
