apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment

spec:
  replicas: 1
  # SQLite の DB を hostPath 上で単一ライターとして開くため、
  # 新旧 Pod が同時に存在すると "the database is locked" で新 Pod が起動できない
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: default
  template:
    metadata:
      labels:
        app: default
    spec:
      containers:
        - name: app
          image: gtstef/filebrowser:1.5.3-stable@sha256:e2ac55ccbe53d63b3f1d7d5ea5b82edf589b005a4b747b59912f97c6ba4f969e
          env:
            - name: TZ
              value: Asia/Tokyo
            - name: FILEBROWSER_CONFIG
              value: /config/config.yaml
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /config/config.yaml
              readOnly: true
              subPath: config.yaml
            - name: data
              mountPath: /data
            - name: public
              mountPath: /mnt/pool/public
              readOnly: true
            - name: music
              mountPath: /mnt/pool/music
            - name: dtv-records-links
              mountPath: /mnt/pool/records_links
              readOnly: true
            - name: dtv-records
              mountPath: /mnt/pool/records
              readOnly: true
            - name: dtv-records-local
              mountPath: /mnt/pool/records_local
              readOnly: true
            - name: dtv-konomitv-capture
              mountPath: /capture
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsUser: 1000
          startupProbe:
            # 初回起動時は全ソースのインデックス作成が走るため、猶予を広く取る
            failureThreshold: 60
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: config
          configMap:
            name: app-config
        - name: data
          hostPath:
            path: /mnt/local/file-browser/data
            type: DirectoryOrCreate
        - name: public
          hostPath:
            path: /mnt/pool/public
            type: DirectoryOrCreate
        - name: music
          hostPath:
            path: /mnt/pool/music
            type: Directory
        - name: dtv-records-links
          hostPath:
            path: /mnt/pool/records_links
            type: Directory
        # シンボリックリンクの解決用
        - name: dtv-records
          hostPath:
            path: /mnt/pool/records
            type: Directory
        - name: dtv-records-local
          hostPath:
            path: /mnt/pool/records_local
            type: Directory
        - name: dtv-konomitv-capture
          hostPath:
            path: /mnt/local/konomitv/data/capture
            type: Directory
        - name: tmp
          emptyDir: {}
      restartPolicy: Always
      securityContext:
        seccompProfile:
          type: RuntimeDefault
