apiVersion: authentik.starry.blue/v1alpha1
kind: AuthentikApplication
metadata:
  name: file-browser

spec:
  access:
    rules:
      - group:
          name: Nerd
  # 既存の Application を取り込む。CR の内容が authentik の現状と一致したときだけ
  # マーカーを付ける。差異があれば Ready=False で止まり、書き込みは起きない。
  adopt: IfMatch
  group: Multimedia
  icon: https://raw.githubusercontent.com/gtsteffaniak/filebrowser/main/frontend/public/img/icons/favicon.svg
  name: FileBrowser
  provider:
    name: file-browser
    flows:
      authentication:
        slug: sign-in
      authorization:
        slug: authorize
      invalidation:
        slug: default-provider-invalidation-flow
    proxy:
      accessTokenValidity: days=1
      forwardAuthSingle:
        externalHost: https://files.starry.blue
      interceptHeaderAuth: true
      outpost:
        name: authentik Embedded Outpost
      refreshTokenValidity: days=30
  slug: file-browser
