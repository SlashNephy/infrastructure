apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: stay-tuned

images:
  # Bitnami は 2025-08 にバージョン固定タグを有償枠へ移し、public.ecr.aws のミラーも 2026-06 に削除した。
  # 無償でバージョンを固定できるのは凍結済みの bitnamilegacy だけなので、そこに固定する。
  - name: docker.io/bitnami/postgresql
    newName: docker.io/bitnamilegacy/postgresql
    newTag: 17.6.0-debian-12-r4@sha256:926356130b77d5742d8ce605b258d35db9b62f2f8fd1601f9dbaef0c8a710a8d

helmCharts:
  - name: postgresql
    releaseName: postgresql
    version: 18.8.4
    repo: oci://registry-1.docker.io/bitnamicharts
    valuesInline:
      auth:
        database: stay-tuned
        existingSecret: postgresql-secret
        username: stay-tuned
      image:
        # チャート 18.x の既定は registry-1.docker.io だが、それだと上の images による
        # 差し替えが名前一致せず無言で素通りするので docker.io に戻す
        registry: docker.io
      primary:
        extraEnvVars:
          - name: TZ
            value: Asia/Tokyo
        persistence:
          existingClaim: stay-tuned-postgresql-data
        resourcesPreset: nano

resources:
  - ./../../common/registry-ghcr-io/lily
  - ./resources/deployment-infra.yaml
  - ./resources/deployment-worker.yaml
  - ./resources/deployment.yaml
  - ./resources/dns.yaml
  - ./resources/ingress.yaml
  - ./resources/secret.yaml
  - ./resources/service.yaml
  - ./resources/volume.yaml
