apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: cloudflare

spec:
  alpnProtocols:
    # https://www.iana.org/assignments/tls-extensiontype-values/tls-extensiontype-values.xhtml#alpn-protocol-ids
    - h3
    - h2
    - h2c
    - http/1.1
  clientAuth:
    clientAuthType: RequireAndVerifyClientCert
    # Cloudflare 共通の origin-pull 証明書は他のアカウントのゾーンからの接続でも提示されるため、
    # starry.blue ゾーン専用のクライアント証明書 (zone-level Authenticated Origin Pulls) に移行する。
    # 移行中は両方の CA を信頼する
    secretNames:
      - cloudflare-ca-secret
      - starry-blue-origin-pull-ca-secret
  maxVersion: VersionTLS13
  minVersion: VersionTLS13
  sniStrict: true

---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: cloudflare-ca-secret

spec:
  itemPath: vaults/4mogpcwrvtvsnpooum4vcevwkm/items/neyppa4fdcfvags52umiawykt4

---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: starry-blue-origin-pull-ca-secret

spec:
  itemPath: vaults/4mogpcwrvtvsnpooum4vcevwkm/items/kz36bd55q62jvl2tlbryf6absy
