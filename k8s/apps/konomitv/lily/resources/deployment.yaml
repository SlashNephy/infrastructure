apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment

spec:
  replicas: 1
  selector:
    matchLabels:
      app: default
  template:
    metadata:
      labels:
        app: default
    spec:
      containers:
        - name: app
          # latest はサーバーコードが QSVEncC に --adapt-resolution を渡すが、同梱の QSVEncC 8.16 は
          # このオプションを持たない。QSVEncC を使うとライブ視聴でエンコーダーが起動直後に落ちるため、
          # 上流が QSVEncC 8.26 を含むイメージを再ビルドするまで config.yaml で FFmpeg を使う。
          #
          # リリースタグ v0.14.1 への固定も試したが、こちらは Mirakurun のバージョンを
          # /api/tuners の Server レスポンスヘッダーから判定する。Mahiron 5 系はこのヘッダーを
          # 返さないため設定バリデーションで弾かれ、KonomiTV が起動しない。
          image: ghcr.io/tsukumijima/konomitv:latest@sha256:477c0d5f8b4253b3fd5a6561f0bc287f5a3dac4d141e96bf83397f901da84ce3
          volumeMounts:
            - name: config
              mountPath: /code/config.yaml
              readOnly: true
              subPath: config.yaml
            - name: data
              mountPath: /code/server/data
            - name: records
              mountPath: /mnt/records
              readOnly: true
            - name: records-local
              mountPath: /mnt/records_local
              readOnly: true
            - name: logs
              mountPath: /code/server/logs
          resources:
            limits:
              gpu.intel.com/i915: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      volumes:
        - name: config
          configMap:
            name: app-config
        - name: data
          hostPath:
            path: /mnt/local/konomitv/data
            type: DirectoryOrCreate
        - name: records
          hostPath:
            path: /mnt/pool/records
            type: Directory
        - name: records-local
          hostPath:
            path: /mnt/pool/records_local
            type: Directory
        - name: logs
          emptyDir: {}
      restartPolicy: Always
      securityContext:
        seccompProfile:
          type: RuntimeDefault
