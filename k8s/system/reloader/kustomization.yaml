apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: reloader

helmCharts:
  # https://github.com/stakater/Reloader/blob/master/deployments/kubernetes/chart/reloader/README.md
  - name: reloader
    releaseName: reloader
    namespace: reloader
    version: 2.2.17
    repo: https://stakater.github.io/stakater-charts
    valuesInline:
      reloader:
        deployment:
          env:
            existing:
              app-secret:
                ALERT_WEBHOOK_URL: ALERT_WEBHOOK_URL

            open:
              ALERT_ON_RELOAD: "true"
              ALERT_SINK: slack
        # 使っているのは adguard-home だけなので、クラスタ全体の Secret を読む ClusterRole を作らず、
        # 対象の namespace だけに Role を置く。annotation を付けた workload を増やすときはここにも足す
        namespaces:
          - adguard-home
        watchGlobally: false
resources:
  - ./resources/namespace.yaml
  - ./resources/secret.yaml
