apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: opentelemetry-collector

helmCharts:
  # https://artifacthub.io/packages/helm/opentelemetry-helm/opentelemetry-collector
  - name: opentelemetry-collector
    releaseName: otel-agent
    namespace: opentelemetry-collector
    version: 0.169.0
    repo: https://open-telemetry.github.io/opentelemetry-helm-charts
    valuesInline:
      config:
        exporters:
          # chart は metrics/traces のパイプラインを既定で作り、debug exporter に
          # 出力する。このリポジトリではログしか扱わず、メトリクスは
          # mackerel-container-agent が別途送っているため、収集結果を捨てる。
          # Helm のマージは null を無視するのでパイプラインごとは消せない。
          nop: {}
          otlphttp/mackerel:
            endpoint: https://otlp-vaxila.mackerelio.com
            headers:
              Mackerel-Api-Key: ${env:MACKEREL_APIKEY}
            sending_queue:
              batch:
                # Mackerel が受け付ける 1 リクエストの上限
                max_size: 3500000
                sizer: bytes
        processors:
          # 除外対象を先に落とし、後続の変換コストを減らす
          filter/optout:
            error_mode: ignore
            logs:
              log_record:
                # k8sattributes preset は tag_name: $$1 / key_regex: (.*) を生成するため、
                # 属性名はアノテーションのキーそのものになる。k8s.pod.annotation. の
                # 接頭辞は付かない。誤ると nil 比較になり静かに機能しなくなる。
                - 'resource.attributes["mackerel.io/logs"] == "false"'
          probabilistic_sampler:
            attribute_source: record
            from_attribute: sample_key
            # Pod ログには trace ID がないため、既定の attribute_source: traceID の
            # ままだと fail_closed: true により全ログが破棄される。100% を指定しても
            # 「trace ID を持つログの 100%」の意味にしかならず、実測で 98.8% が
            # 消えていた。種を k8s.pod.uid に明示する。
            #
            # 率を下げると Pod 単位で採否が決まる。採用された Pod のログは全量残り、
            # 残りは全破棄される（WARN 以上は sampling_priority で常に通る）。
            mode: hash_seed
            # 初期値は 100%。発生源の是正により全量でも月 720 円に収まるため、
            # まず全量送信して実データを確認する。
            sampling_percentage: 100
            sampling_priority: sample_priority
          transform/journald_sampling:
            error_mode: ignore
            log_statements:
              # WARN 以上は優先度 100 を付与し、サンプリング率に関わらず必ず通す
              - set(log.attributes["sample_priority"], 100)
                  where log.severity_number >= SEVERITY_NUMBER_WARN
              # journald は Alloy から OTLP で届くため k8sattributes を通らず、
              # k8s.pod.uid を持たない。Pod ログ用の種を流用すると空のままになり、
              # fail_closed: true で WARN 未満が全破棄される。
              # systemd の unit を種にすることで、率を下げたときに unit 単位で
              # 採否が決まり、選ばれた unit のログは前後関係を保ったまま残る。
              #
              # Alloy の otelcol.receiver.loki は Loki のラベルをログレコード属性に
              # 載せる。リソース属性ではない。Mackerel の画面で実データを確認する
              # までは resource.attributes を参照しており、unit が常に nil になって
              # 種が固定値 "systemd" に落ちていた。この状態で率を下げると journald
              # 全体が全通過か全破棄の二択になる。
              - set(log.attributes["sample_key"], log.attributes["unit"])
                  where log.attributes["unit"] != nil
              - set(log.attributes["sample_key"], "systemd")
                  where log.attributes["sample_key"] == nil
          transform/journald_service_name:
            error_mode: ignore
            log_statements:
              # ノードの systemd ログはクラスタ単位で扱う
              - set(resource.attributes["service.namespace"], "lily")
              - set(resource.attributes["service.name"], "systemd")
          transform/sampling:
            error_mode: ignore
            log_statements:
              # WARN 以上は優先度 100 を付与し、サンプリング率に関わらず必ず通す
              - set(log.attributes["sample_priority"], 100)
                  where log.severity_number >= SEVERITY_NUMBER_WARN
              # probabilistic_sampler の attribute_source: record はログレコード
              # 属性しか見ない。k8s.pod.uid は k8sattributes がリソース属性に
              # 付けるため、ここでレコード属性へ複写しないと参照できない。
              #
              # 種が空のままだと fail_closed: true により全破棄される。この
              # パイプラインは filelog 由来の Pod ログ専用で k8sattributes を
              # 通るため k8s.pod.uid は必ず存在するが、万一欠けた場合に
              # 静かに消えることを避けて service.name を代替の種にする。
              - set(log.attributes["sample_key"], resource.attributes["k8s.pod.uid"])
                  where resource.attributes["k8s.pod.uid"] != nil
              - set(log.attributes["sample_key"], resource.attributes["service.name"])
                  where log.attributes["sample_key"] == nil
          transform/service_name:
            error_mode: ignore
            log_statements:
              - set(resource.attributes["service.namespace"],
                    resource.attributes["k8s.namespace.name"])
              - set(resource.attributes["service.name"],
                    resource.attributes["k8s.deployment.name"])
                  where resource.attributes["k8s.deployment.name"] != nil
              - set(resource.attributes["service.name"],
                    resource.attributes["k8s.daemonset.name"])
                  where resource.attributes["service.name"] == nil
                    and resource.attributes["k8s.daemonset.name"] != nil
              - set(resource.attributes["service.name"],
                    resource.attributes["k8s.statefulset.name"])
                  where resource.attributes["service.name"] == nil
                    and resource.attributes["k8s.statefulset.name"] != nil
              - set(resource.attributes["service.name"],
                    resource.attributes["k8s.pod.name"])
                  where resource.attributes["service.name"] == nil
          transform/severity:
            error_mode: ignore
            log_statements:
              # zerolog の ConsoleWriter 形式は ANSI カラーエスケープを含む。
              # 先に除去しないと後続の正規表現がレベル表記に一致しない。
              - replace_pattern(log.body, "\\x1b\\[[0-9;]*m", "") where IsString(log.body)
              # filelog receiver の container operator は本文を文字列のまま body に
              # 入れるため、JSON ログも自動ではパースされない。明示的にパースして
              # map に変換することで、level の判定と Mackerel 画面での属性検索が効く。
              - set(log.body, ParseJSON(log.body))
                  where IsString(log.body) and IsMatch(log.body, "^\\s*\\{")

              # 以降はレベル表記を log.cache["level"] にいったん集約し、最後に
              # まとめて severity へ変換する。判定の「どこを見るか」と「何レベルか」
              # を分離することで、対応形式を増やしても変換部が肥大化しない。
              # cache はログレコードごとに独立しており、前の行の値は残らない。

              # journald は systemd の PRIORITY を持つ。本文からの推測より確実で
              # あるため最優先で採用する。Alloy の relabel で journal_priority
              # ラベルとして残しており、値は syslog のキーワード表記
              # (emerg / alert / crit / error / warning / notice / info / debug) になる。
              #
              # Alloy の otelcol.receiver.loki は Loki のラベルをリソース属性では
              # なくログレコード属性に載せる。どちらに載るかは Mackerel の画面で
              # 実データを見て確認した。resource.attributes を参照すると nil 比較に
              # なり、警告もエラーも出ないまま常に判定に失敗する。
              - set(log.cache["level"], log.attributes["journal_priority"])
                  where log.attributes["journal_priority"] != nil

              # 構造化ログはレベルを持つキーから読む。キー名はアプリケーションに
              # よって異なるため、よく使われるものを順に見る。
              - set(log.cache["level"], log.body["level"])
                  where log.cache["level"] == nil
                    and not IsString(log.body) and log.body["level"] != nil
              - set(log.cache["level"], log.body["severity"])
                  where log.cache["level"] == nil
                    and not IsString(log.body) and log.body["severity"] != nil
              - set(log.cache["level"], log.body["lvl"])
                  where log.cache["level"] == nil
                    and not IsString(log.body) and log.body["lvl"] != nil

              # テキストログは本文からレベル表記を切り出す。本文全体への部分一致は
              # 使えない。"watch ended with error" のように、メッセージ中の単語に
              # 引きずられて INFO のログを ERROR と誤判定するためである。
              # 先頭 72 文字以内の、区切り文字に挟まれた表記だけを拾い、最も左に
              # 現れたものを採用する。72 文字はタイムスタンプが最も長い形式
              # (Aug  4 11:36:34 (1785810994.460354) danted[120236]: info:) を
              # 収める幅として決めた。
              #
              # ExtractPatterns は一致しなかった名前付きグループも空文字で返す。
              # 1 つの正規表現に複数のグループを持たせると空文字と未一致を区別
              # できなくなるため、形式ごとに 1 グループの正規表現に分けている。

              # klog (Kubernetes 系コンポーネント)。行頭の I0804 / E0803 形式。
              - set(log.cache["match"],
                    ExtractPatterns(log.body, "^(?P<level>[DIWEF])\\d{4}\\s"))
                  where IsString(log.body)
              - set(log.cache["level"], log.cache["match"]["level"])
                  where IsString(log.body) and log.cache["match"]["level"] != nil
              # telegraf。E! / W! / I! / D! の 1 文字表記。
              - set(log.cache["match"],
                    ExtractPatterns(log.body, "^.{0,72}?(?:^|\\s)(?P<level>[DIWEF])!\\s"))
                  where IsString(log.body) and log.cache["level"] == nil
              - set(log.cache["level"], log.cache["match"]["level"])
                  where IsString(log.body) and log.cache["level"] == nil
                    and log.cache["match"]["level"] != nil
              # PostgreSQL の LOG:。LOG は一般的な英単語であり、大文字かつ直後が
              # コロンのときだけレベル表記とみなす。ERROR / FATAL など他のレベルは
              # 後続の汎用パターンで拾える。
              - set(log.cache["match"],
                    ExtractPatterns(log.body, "^.{0,72}?(?:^|\\s)(?P<level>LOG):"))
                  where IsString(log.body) and log.cache["level"] == nil
              - set(log.cache["level"], log.cache["match"]["level"])
                  where IsString(log.body) and log.cache["level"] == nil
                    and log.cache["match"]["level"] != nil
              # 汎用。level=info / [INFO] / |INFO| / INFO: / タブ区切りの INFO など、
              # 区切り文字に挟まれたレベル表記を拾う。長い綴りを先に並べているのは、
              # RE2 の選択肢が左優先で、warn を先に置くと warning が warn として
              # 切り出されてしまうためである。
              - set(log.cache["match"],
                    ExtractPatterns(log.body,
                      "^.{0,72}?(?:^|[\\s\\[|,=])(?P<level>(?i:trace|trc|debug|dbg|warning|warn|wrn|information|info|inf|notice|error|err|fatal|ftl|panic|pnc|critical|crit|alert|emerg))(?:[\\s\\]|:!,=]|$)"))
                  where IsString(log.body) and log.cache["level"] == nil
              - set(log.cache["level"], log.cache["match"]["level"])
                  where IsString(log.body) and log.cache["level"] == nil
                    and log.cache["match"]["level"] != nil

              # 表記ゆれを小文字に寄せてから変換する
              - set(log.cache["level"], ConvertCase(log.cache["level"], "lower"))
                  where log.cache["level"] != nil

              # severity_number と severity_text の双方を設定する。Mackerel の画面が
              # どちらを表示に使うかは非公開であり、片方だけでは UNSPECIFIED の
              # ままになる可能性があるため。
              - set(log.severity_number, SEVERITY_NUMBER_TRACE)
                  where IsMatch(log.cache["level"], "^(trace|trc)$")
              - set(log.severity_text, "TRACE")
                  where IsMatch(log.cache["level"], "^(trace|trc)$")
              - set(log.severity_number, SEVERITY_NUMBER_DEBUG)
                  where IsMatch(log.cache["level"], "^(debug|dbg|d)$")
              - set(log.severity_text, "DEBUG")
                  where IsMatch(log.cache["level"], "^(debug|dbg|d)$")
              - set(log.severity_number, SEVERITY_NUMBER_INFO)
                  where IsMatch(log.cache["level"], "^(info|inf|information|i|log)$")
              - set(log.severity_text, "INFO")
                  where IsMatch(log.cache["level"], "^(info|inf|information|i|log)$")
              # syslog の notice に対応する severity は OpenTelemetry には無い。
              # info より一段高い INFO2 に寄せる。
              - set(log.severity_number, SEVERITY_NUMBER_INFO2)
                  where IsMatch(log.cache["level"], "^notice$")
              - set(log.severity_text, "NOTICE")
                  where IsMatch(log.cache["level"], "^notice$")
              - set(log.severity_number, SEVERITY_NUMBER_WARN)
                  where IsMatch(log.cache["level"], "^(warning|warn|wrn|w)$")
              - set(log.severity_text, "WARN")
                  where IsMatch(log.cache["level"], "^(warning|warn|wrn|w)$")
              - set(log.severity_number, SEVERITY_NUMBER_ERROR)
                  where IsMatch(log.cache["level"], "^(error|err|e)$")
              - set(log.severity_text, "ERROR")
                  where IsMatch(log.cache["level"], "^(error|err|e)$")
              - set(log.severity_number, SEVERITY_NUMBER_FATAL)
                  where IsMatch(log.cache["level"], "^(fatal|ftl|panic|pnc|critical|crit|alert|emerg|f)$")
              - set(log.severity_text, "FATAL")
                  where IsMatch(log.cache["level"], "^(fatal|ftl|panic|pnc|critical|crit|alert|emerg|f)$")
        receivers:
          filelog:
            # preset の includeCollectorLogs は otel-agent 自身の分しか除外しない。
            # otel-cluster のログも Mackerel に送られてしまうため、両方を除外する。
            exclude:
              - /var/log/pods/opentelemetry-collector_otel-*_*/opentelemetry-collector/*.log
          # Alloy から journald ログを OTLP で受け取る。journalctl を実行できない
          # distroless イメージの代わりに、libsystemd を直接呼ぶ Alloy に読み取りを任せる。
          otlp:
            protocols:
              grpc:
                endpoint: 0.0.0.0:4317
        service:
          pipelines:
            logs:
              exporters:
                - otlphttp/mackerel
              processors:
                # Helm の values マージでは配列は置換されるため、chart が既定で
                # 入れる memory_limiter と batch を明示的に書き戻す必要がある。
                # 省略すると logs パイプラインからだけ両者が消える。
                - memory_limiter
                - filter/optout
                - transform/severity
                - transform/service_name
                - transform/sampling
                - probabilistic_sampler
                - batch
              # otlp receiver を追加した際、chart のプリセットが「シグナルに対応する
              # receiver は明示指定がなければ自動的に追加する」ため、指定しないと
              # journald 用の otlp receiver がこの Pod ログ用パイプラインにも二重に
              # 接続されてしまう（journald のログが未整形のまま Mackerel に二重送信される）。
              # そのため filelog のみを明示し、otlp の混入を防ぐ。
              receivers:
                - filelog
            logs/journald:
              exporters:
                - otlphttp/mackerel
              processors:
                # Pod ログと同じ severity 判定とサンプリングを通す。省略すると
                # journald だけが常に全量送信され、サンプリング率を下げたときに
                # 送信量の見積もりが崩れる。
                # ただしサンプリングの種は Pod ログ用と共用できない
                # （journald は k8s.pod.uid を持たない）ため、専用のものを使う。
                - memory_limiter
                - transform/severity
                - transform/journald_service_name
                - transform/journald_sampling
                - probabilistic_sampler
                - batch
              receivers:
                - otlp
            metrics:
              exporters:
                - nop
            traces:
              exporters:
                - nop
      extraEnvs:
        - name: MACKEREL_APIKEY
          valueFrom:
            secretKeyRef:
              name: mackerel-api-key
              key: apiKey
      image:
        repository: otel/opentelemetry-collector-k8s
      mode: daemonset
      podSecurityContext:
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
        # /var/log/pods 配下のログファイルが 0640 root:root であるため、
        # 読み取りには root グループへの所属が必要になる
        supplementalGroups:
          - 0
      ports:
        # DaemonSet では hostPort がノード IP に露出する。この Collector は
        # Mackerel API キーを持つため、認証なしの受信口を LAN に開けない。
        # Alloy からの接続は Service (internalTrafficPolicy: Local) 経由で足りる。
        jaeger-compact:
          enabled: false
        jaeger-grpc:
          enabled: false
        jaeger-thrift:
          enabled: false
        otlp:
          hostPort: 0
        otlp-http:
          enabled: false
        zipkin:
          enabled: false
      presets:
        kubernetesAttributes:
          enabled: true
          extractAllPodAnnotations: true
          extractAllPodLabels: true
        logsCollection:
          enabled: true
          includeCollectorLogs: false
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        privileged: false
        readOnlyRootFilesystem: true
      service:
        # chart は mode: daemonset のとき Service を既定で作らないため、Alloy から
        # OTLP (:4317) を受けるために明示的に有効化する。daemonset モードで有効化
        # すると internalTrafficPolicy が既定で Local になり、同一ノードの Pod
        # にしか届かない。DaemonSet に対する Service としては望ましい挙動であり、
        # lily は単一ノードクラスタのため実用上も問題ない。
        enabled: true

  - name: opentelemetry-collector
    releaseName: otel-cluster
    namespace: opentelemetry-collector
    version: 0.169.0
    repo: https://open-telemetry.github.io/opentelemetry-helm-charts
    valuesInline:
      config:
        exporters:
          # kubernetesEvents preset は logs パイプラインのみを使うが、chart は
          # metrics/traces のパイプラインも既定で作り、debug exporter に出力する。
          # このリリースはイベント収集専用でメトリクス・トレースは扱わないため、
          # 収集結果を捨てる。Helm のマージは null を無視するのでパイプラインごとは消せない。
          nop: {}
          otlphttp/mackerel:
            endpoint: https://otlp-vaxila.mackerelio.com
            headers:
              Mackerel-Api-Key: ${env:MACKEREL_APIKEY}
            sending_queue:
              batch:
                # Mackerel が受け付ける 1 リクエストの上限
                max_size: 3500000
                sizer: bytes
        processors:
          transform/service_name:
            error_mode: ignore
            log_statements:
              # クラスタ全体のイベントであり、特定の namespace に属さない
              - set(resource.attributes["service.namespace"], "lily")
              - set(resource.attributes["service.name"], "kubernetes-events")
        service:
          pipelines:
            logs:
              exporters:
                - otlphttp/mackerel
              processors:
                # 配列は置換されるため、chart 既定の memory_limiter と batch を明示する
                - memory_limiter
                - transform/service_name
                - batch
            metrics:
              exporters:
                - nop
            traces:
              exporters:
                - nop
      extraEnvs:
        - name: MACKEREL_APIKEY
          valueFrom:
            secretKeyRef:
              name: mackerel-api-key
              key: apiKey
      image:
        repository: otel/opentelemetry-collector-k8s
      mode: deployment
      podSecurityContext:
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      presets:
        kubernetesEvents:
          enabled: true
      replicaCount: 1
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        privileged: false
        readOnlyRootFilesystem: true

resources:
  - ./resources/namespace.yaml
  - ./resources/network-policy.yaml
  - ./resources/secret.yaml
