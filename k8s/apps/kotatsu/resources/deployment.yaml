# Kotatsu の全ロール (tenban、neko、mikan、nekonote、kyusu) を 1 つの Pod で動かす。
# 録画は /mnt/pool/records に書く。EPGStation から取り込んだ録画も同じ場所にあるので、そのまま再生できる。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app

spec:
  replicas: 1
  # 録画中のファイルを 2 つの Pod から書かないよう、古い Pod を止めてから新しい Pod を作る。
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kotatsu
  template:
    metadata:
      labels:
        app: kotatsu
    spec:
      initContainers:
        # 起動する前に、スキーマを最新にする。Kotatsu は、スキーマが古いと起動しない。
        - name: migrate
          image: ghcr.io/slashnephy/kotatsu:edge-ffmpeg@sha256:2dc831991a27327725dc7b1fbb9ebdde2492c04c5d3d145df1457e848e612f1e
          args:
            - migrate
          env:
            - name: KOTATSU_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kotatsu-db-app
                  key: uri
          resources:
            limits:
              memory: 256Mi
            requests:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      containers:
        - name: app
          image: ghcr.io/slashnephy/kotatsu:edge-ffmpeg@sha256:2dc831991a27327725dc7b1fbb9ebdde2492c04c5d3d145df1457e848e612f1e
          args:
            - all
          env:
            - name: KOTATSU_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kotatsu-db-app
                  key: uri
            - name: KOTATSU_TUNER_URL
              value: http://app.mahiron:40772/
            # local は、クラウドに同期しない録画の置き場所。EPGStation の「Drive 同期なし」にあたる。
            - name: KOTATSU_STORAGE_POOLS
              value: main=/records,local=/records_local
            # 索引、代表画像、プレビュー画像などの生成物を、録画のセグメントの ID ごとに置く。プールがあれば必須。
            - name: KOTATSU_STORAGE_DATA_DIR
              value: /data
            # 外からは traefik を経て届き、認証の前段は authentik が担う。
            # 送信元の判定は traefik (Pod のネットワーク) が付ける X-Forwarded-For に頼る。
            - name: KOTATSU_SERVER_ALLOWED_NETWORKS
              value: 0.0.0.0/0,::/0
            - name: KOTATSU_SERVER_TRUSTED_PROXIES
              value: 10.0.0.0/16
            - name: KOTATSU_SERVER_LISTEN
              value: :8080
            - name: KOTATSU_METRICS_LISTEN
              value: :9090
            # client ID と client secret は、operator が作る Secret の kotatsu-oidc から読む (authentik.yaml)。
            - name: KOTATSU_AUTH_OIDC_ISSUER
              value: https://id.starry.blue/application/o/kotatsu/
            - name: KOTATSU_AUTH_OIDC_DISPLAY_NAME
              value: id.starry.blue
            # Application に入れる人 (Nerd) は、初めてのログインでメンバーとして作る。
            # 管理者は、既存のユーザーに kotatsu user link-oidc で紐付ける。
            - name: KOTATSU_AUTH_OIDC_AUTO_CREATE_ENABLED
              value: "true"
            - name: KOTATSU_AUTH_OIDC_AUTO_CREATE_MEMBER_GROUPS
              value: Nerd
          envFrom:
            - secretRef:
                name: kotatsu
            - secretRef:
                name: kotatsu-oidc
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          volumeMounts:
            - name: records
              mountPath: /records
            - name: records-local
              mountPath: /records_local
            - name: data
              mountPath: /data
            # kyusu の HLS と、FFmpeg の一時ファイルを置く。
            - name: tmp
              mountPath: /tmp
          resources:
            limits:
              memory: 4Gi
            requests:
              cpu: 100m
              memory: 512Mi
          livenessProbe:
            failureThreshold: 4
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      volumes:
        # /mnt/pool/records の持ち主は uid 1000 なので、同じ uid で書く。
        # local の PV にすると、kubelet が fsGroup でディレクトリ全体の持ち主を書き換えうるので、hostPath で渡す。
        - name: records
          hostPath:
            path: /mnt/pool/records
            type: Directory
        - name: records-local
          hostPath:
            path: /mnt/pool/records_local
            type: Directory
        # 持ち主は uid 1000。DirectoryOrCreate だと root の持ち物で作られて書けないので、作ってあるものを使う。
        - name: data
          hostPath:
            path: /mnt/local/kotatsu/data
            type: Directory
        - name: tmp
          emptyDir:
            sizeLimit: 8Gi
      restartPolicy: Always
      # Kubernetes の API は使わない。
      automountServiceAccountToken: false
      priorityClassName: recording
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: kotatsu
      # 録画を止めずに引き継ぐ時間を取る。
      terminationGracePeriodSeconds: 300

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kotatsu
automountServiceAccountToken: false
