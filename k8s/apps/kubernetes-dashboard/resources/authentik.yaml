apiVersion: authentik.starry.blue/v1alpha1
kind: AuthentikApplication
metadata:
  name: kubernetes-dashboard

spec:
  access:
    rules:
      - group:
          name: Admin
  adopt: IfMatch
  group: System
  icon: https://raw.githubusercontent.com/kubernetes/kubernetes/master/logo/logo.png
  name: Kubernetes Dashboard
  provider:
    name: Kubernetes Dashboard
    flows:
      authentication:
        slug: sign-in
      authorization:
        slug: authorize
      invalidation:
        slug: default-provider-invalidation-flow
    proxy:
      accessTokenValidity: days=1
      forwardAuthSingle:
        externalHost: https://k8s.starry.blue
      interceptHeaderAuth: true
      outpost:
        name: authentik Embedded Outpost
      refreshTokenValidity: days=30
  slug: kubernetes-dashboard
