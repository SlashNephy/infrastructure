name: Deploy watch-k8s-events

on:
  push:
    paths:
      - cmd/watch-k8s-events/**
  workflow_dispatch:

permissions: {}

jobs:
  build:
    uses: SlashNephy/actions/.github/workflows/build-docker-image.yml@d5bbbb58e94f3b25497f996ea141b31d6db26857 # v1.0.1
    permissions:
      contents: read
      packages: write
      actions: read
      security-events: write
    with:
      context: cmd/watch-k8s-events
      image-name: ghcr.io/slashnephy/watch-k8s-events
      image-platforms: linux/amd64
      dispatch-update-image-digest: true
    secrets:
      dispatch-app-private-key: ${{ secrets.DISPATCH_APP_PRIVATE_KEY }}
