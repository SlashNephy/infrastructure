apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: route-whoami

spec:
  routes:
    # bot のクロールを抑止するため robots.txt を返す。
    - kind: Rule
      match: Host(`whoami.starry.blue`) && Path(`/robots.txt`)
      priority: 100
      services:
        - name: robots-txt
          namespace: traefik
          port: http

    - kind: Rule
      match: Host(`whoami.starry.blue`)
      services:
        - name: whoami
          port: http

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: route-whoami-web

spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: PathPrefix(`/whoami`)
      services:
        - name: whoami
          port: http
