apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: n8n

images:
  # チャートの更新が遅いのでセルフアップデート
  - name: n8nio/n8n
    newTag: 2.40.0@sha256:fba7e81fa077ad8b6486804fec33a962ab44a64ce9e3bc8d488465b0f8d65a52

helmCharts:
  # https://github.com/8gears/n8n-helm-chart
  - name: n8n
    releaseName: n8n
    namespace: n8n
    version: 2.1.1
    repo: oci://8gears.container-registry.com/library
    includeCRDs: true
    valuesInline:
      main:
        config:
          db:
            postgresdb:
              database: n8n
              host: postgresql
              user: n8n
            type: postgresdb
          generic:
            timezone: Asia/Tokyo
          n8n:
            diagnostics_enabled: "false"
            host: n8n.starry.blue
            protocol: https
            proxy_hops: "1"
            version_notifications_enabled: "false"
        extraEnv:
          DB_POSTGRESDB_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: postgresql-secret
                key: password
          N8N_ENCRYPTION_KEY:
            valueFrom:
              secretKeyRef:
                name: n8n-secret
                key: encryption_key
          N8N_LICENSE_ACTIVATION_KEY:
            valueFrom:
              secretKeyRef:
                name: n8n-secret
                key: license_activation_key
        # チャート既定は liveness / readiness とも /healthz を向いているが、これはプロセスの生存しか
        # 見ないため、DB 接続が切れて n8n が自力で復帰できなくなっても Pod は Ready のまま放置される。
        # 実際 2026-08-08 に PostgreSQL の再起動をきっかけに n8n の再接続機構が発火せず、
        # /rest/login が 503 Database is not ready! を返し続けた。
        # DB 接続まで見る /healthz/readiness を向けて、Kubernetes 側から検知・自己修復できるようにする。
        livenessProbe:
          # PostgreSQL の再起動やメンテナンスで一時的に落ちただけで再起動ループに入らないよう、
          # 5 分 (10s × 30) の猶予を持たせる。チャート既定の failureThreshold と同値。
          failureThreshold: 30
          httpGet:
            path: /healthz/readiness
            port: http
          periodSeconds: 10
        persistence:
          enabled: true
          existingClaim: n8n-data
          type: existing
        readinessProbe:
          # 疎通不能なうちにリクエストを流し込まないよう、readiness は liveness より早く落とす。
          failureThreshold: 3
          httpGet:
            path: /healthz/readiness
            port: http
          periodSeconds: 10
      # TODO: worker を分離
      # worker:
      #   enabled: true
      #   replicaCount: 1
      # valkey:
      #   enabled: true
      #   auth:
      #     enabled: false

resources:
  - ./resources/configmap-postgresql.yaml
  - ./resources/cronjob-backup.yaml
  - ./resources/cronjob-cleanup-backup.yaml
  - ./resources/dns.yaml
  - ./resources/ingress.yaml
  - ./resources/secret.yaml
  - ./resources/service-lm-studio.yaml
  - ./resources/service-postgresql.yaml
  - ./resources/statefulset-postgresql.yaml
  - ./resources/volume-backup.yaml
  - ./resources/volume-data.yaml
  - ./resources/volume-postgresql.yaml
