apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: route

spec:
  routes:
    # bot のクロールを抑止するため robots.txt を返す。
    - kind: Rule
      match: Host(`kotatsu.starry.blue`) && Path(`/robots.txt`)
      priority: 100
      services:
        - name: robots-txt
          namespace: traefik
          port: http

    - kind: Rule
      match: Host(`kotatsu.starry.blue`)
      priority: 10
      services:
        - name: kotatsu
          port: http
      middlewares:
        - name: forward-auth-authentik
          namespace: authentik

    - kind: Rule
      match: Host(`kotatsu.starry.blue`) && PathPrefix(`/outpost.goauthentik.io/`)
      priority: 15
      services:
        - name: authentik-server
          namespace: authentik
          port: http

    # EPGStation 互換の読み取り API (kiririn などから使う)。Kotatsu が API トークン (Bearer) で認証するので、
    # Authentik の forward-auth を通さない。トークンがなければ Kotatsu が 401 を返す。
    - kind: Rule
      match: Host(`kotatsu.starry.blue`) && PathPrefix(`/api/`)
      priority: 20
      services:
        - name: kotatsu
          port: http

    # MCP サーバーと、MCP のクライアントがトークンを得るための OAuth の端点。クライアントはブラウザを持たずに
    # 直接叩くので、Authentik の forward-auth を通さない。Kotatsu が自身の発行したトークンで認証し、
    # MCP を無効にしているときは 404 を返す。同意の画面に送る /oauth/authorize は、ブラウザで開くので forward-auth を通す。
    - kind: Rule
      match: Host(`kotatsu.starry.blue`) && (Path(`/mcp`) || PathPrefix(`/.well-known/oauth-protected-resource`) || Path(`/.well-known/oauth-authorization-server`) || Path(`/oauth/token`) || Path(`/oauth/revoke`))
      priority: 20
      services:
        - name: kotatsu
          port: http

    # 外形監視のため、ヘルスチェックの端点だけ認証を迂回させる。中身を返さない。
    - kind: Rule
      match: Host(`kotatsu.starry.blue`) && Path(`/healthz`)
      priority: 20
      services:
        - name: kotatsu
          port: http
