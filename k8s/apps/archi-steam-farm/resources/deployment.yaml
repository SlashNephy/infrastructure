apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment

spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      initContainers:
        # FreePackages を FREE_PACKAGES_VERSION の版に揃える。同じ版が導入済みならネットワークにアクセスしない。
        # ASF は版の合わないプラグインがあると起動しないため、ASF のメジャー更新時は URL の V7 も変更する。
        - name: install-free-packages
          image: alpine:3.24@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
          command:
            - sh
            - -euc
            - |
              plugin_dir=/plugins/FreePackages
              staging_dir=/plugins/.FreePackages.new
              marker=.installed-version

              rm -rf "$staging_dir"

              if [ "$(cat "$plugin_dir/$marker" 2>/dev/null || true)" = "$FREE_PACKAGES_SHA256" ]; then
                echo "FreePackages $FREE_PACKAGES_VERSION is already installed"
                exit 0
              fi

              mkdir "$staging_dir"
              wget -O /tmp/FreePackages.zip "https://github.com/Citrinate/FreePackages/releases/download/$FREE_PACKAGES_VERSION/FreePackages-V7.zip"
              echo "$FREE_PACKAGES_SHA256  /tmp/FreePackages.zip" | sha256sum -c -
              unzip -q /tmp/FreePackages.zip -d "$staging_dir"
              rm /tmp/FreePackages.zip
              test -f "$staging_dir/FreePackages.dll"
              echo "$FREE_PACKAGES_SHA256" > "$staging_dir/$marker"

              rm -rf "$plugin_dir"
              mv "$staging_dir" "$plugin_dir"
              echo "FreePackages $FREE_PACKAGES_VERSION has been installed"
          env:
            # renovate: datasource=github-release-attachments depName=Citrinate/FreePackages
            - name: FREE_PACKAGES_VERSION
              value: 1.7.2.2
            - name: FREE_PACKAGES_SHA256
              value: d717eb5d24ec920c1dfea2a02a4998a8e408ec72e84f23938365dca9246e693c
          volumeMounts:
            - name: plugins
              mountPath: /plugins
            - name: tmp
              mountPath: /tmp
          resources:
            limits:
              memory: 128Mi
            requests:
              memory: 16Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsUser: 1000
      containers:
        - name: app
          image: ghcr.io/justarchinet/archisteamfarm:7.0.0.10@sha256:900e556d49c7247a9b987311bf0ac2de9a3724d8898a49ecb07cd18d2ce0b168
          env:
            - name: TZ
              value: Asia/Tokyo
          envFrom:
            - secretRef:
                name: secret
          ports:
            - containerPort: 1242
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: plugins
              mountPath: /asf/plugins/external
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            limits:
              memory: 1Gi
            requests:
              memory: 640Mi
          livenessProbe:
            httpGet:
              path: /
              port: 1242
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 1242
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsUser: 1000
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /
              port: 1242
            periodSeconds: 5
            timeoutSeconds: 5
      volumes:
        - name: config
          hostPath:
            path: /mnt/local/archi-steam-farm/config
            type: Directory
        - name: plugins
          hostPath:
            path: /mnt/local/archi-steam-farm/plugins
            type: Directory
        - name: tmp
          emptyDir: {}
      restartPolicy: Always
      automountServiceAccountToken: false
      hostname: archi-steam-farm
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
